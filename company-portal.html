<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0e11;
    --bg-2:#101318;
    --surface:#15181e;
    --surface-2:#1a1e26;
    --surface-hover:#1e232c;
    --border:#252a33;
    --border-soft:#1e222a;
    --text:#e7eaef;
    --text-dim:#9aa1ad;
    --text-faint:#6b7280;
    --accent:#5b8cff;
    --accent-soft:rgba(91,140,255,.14);
    --accent-line:rgba(91,140,255,.35);
    --teal:#3ec7c2;
    --amber:#f0b64b;
    --green:#54c98a;
    --rose:#f2748c;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 3px rgba(0,0,0,.28);
  }
  [data-theme="light"]{
    --bg:#f3f5f8;
    --bg-2:#eceef2;
    --surface:#ffffff;
    --surface-2:#f4f6f9;
    --surface-hover:#eef1f5;
    --border:#dde1e8;
    --border-soft:#e7eaf0;
    --text:#181b21;
    --text-dim:#565d6b;
    --text-faint:#8a91a0;
    --accent:#3d6ff5;
    --accent-soft:rgba(61,111,245,.12);
    --accent-line:rgba(61,111,245,.4);
    --shadow:0 1px 3px rgba(20,30,60,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}

  /* ---------- shell ---------- */
  .shell{max-width:1180px;margin:0 auto;padding:28px 22px 80px}
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    gap:20px;flex-wrap:wrap;margin-bottom:26px;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:linear-gradient(140deg,var(--accent),#7a5bff);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;
    box-shadow:0 4px 16px rgba(91,140,255,.28);
  }
  .brand h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  .brand span{display:block;font-size:12px;color:var(--text-faint);font-weight:400}

  /* ---------- toggle ---------- */
  .view-toggle{
    display:inline-flex;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:4px;gap:2px;
  }
  .view-toggle button{
    all:unset;cursor:pointer;padding:8px 18px;border-radius:9px;
    font-size:13.5px;font-weight:500;color:var(--text-dim);
    display:flex;align-items:center;gap:8px;transition:.16s;
  }
  .view-toggle button:hover{color:var(--text)}
  .view-toggle button.active{background:var(--accent-soft);color:#bcd0ff}
  .view-toggle button.active .dot{background:var(--accent)}
  .view-toggle .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint)}

  /* header controls cluster */
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .icon-btn{
    all:unset;cursor:pointer;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);transition:.16s;
  }
  .icon-btn:hover{color:var(--text);background:var(--surface-hover);border-color:var(--border)}
  .icon-btn svg{width:19px;height:19px}
  .acct{
    all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
    color:#fff;font-weight:700;font-size:14px;background:linear-gradient(140deg,#5b8cff,#7a5bff);
    box-shadow:0 3px 12px rgba(91,140,255,.3);position:relative;transition:transform .16s;
  }
  .acct:hover{transform:scale(1.05)}
  .acct .status{position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}

  /* settings modal */
  .overlay{
    position:fixed;inset:0;background:rgba(6,8,12,.6);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;padding:70px 18px;z-index:50;
  }
  .overlay.open{display:flex;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);
    border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);
    animation:pop .2s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
  .modal .m-top{display:flex;align-items:center;gap:14px;padding:20px;border-bottom:1px solid var(--border-soft)}
  .modal .m-top .m-av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;background:linear-gradient(140deg,#5b8cff,#7a5bff);flex:none}
  .modal .m-top .m-nm{font-size:15px;font-weight:600}
  .modal .m-top .m-em{font-size:12.5px;color:var(--text-faint)}
  .modal .m-top .m-x{margin-left:auto;all:unset;cursor:pointer;color:var(--text-faint);font-size:20px;line-height:1;padding:6px}
  .modal .m-x:hover{color:var(--text)}
  .m-sec{padding:8px 12px}
  .m-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);padding:10px 8px 6px}
  .m-row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;cursor:pointer;transition:.14s;font-size:13.5px;font-weight:500}
  .m-row:hover{background:var(--surface-hover)}
  .m-row svg{width:17px;height:17px;color:var(--text-dim)}
  .m-row .chev{margin-left:auto;color:var(--text-faint)}
  .m-row.danger{color:var(--rose)}
  .m-row.danger svg{color:var(--rose)}
  /* segmented theme control inside modal */
  .seg{margin-left:auto;display:inline-flex;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:9px;padding:3px}
  .seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:500;color:var(--text-dim);display:flex;align-items:center;gap:6px}
  .seg button svg{width:14px;height:14px}
  .seg button.on{background:var(--accent-soft);color:var(--accent)}

  /* ---------- business tabs (single view) ---------- */
  .biz-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
  .biz-tab{
    all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:10px 15px;border-radius:11px;border:1px solid var(--border-soft);
    background:var(--surface);font-size:13.5px;font-weight:500;color:var(--text-dim);
    transition:.16s;
  }
  .biz-tab:hover{background:var(--surface-hover);color:var(--text)}
  .biz-tab.active{border-color:var(--accent-line);background:var(--accent-soft);color:#cdddff}
  .biz-tab .glyph{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}

  /* ---------- section ---------- */
  .eyebrow{
    font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--text-faint);margin:32px 0 13px;display:flex;align-items:center;gap:9px;
  }
  .eyebrow:first-of-type{margin-top:6px}
  .eyebrow .count{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;
    color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border-soft);
    padding:1px 7px;border-radius:20px;letter-spacing:0;text-transform:none;
  }

  /* ---------- panel card (wraps every section) ---------- */
  .panel{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);
    margin-top:16px;overflow:hidden;
  }
  .panel > .p-head{
    display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border-soft);
  }
  .panel > .p-head .p-ic{width:16px;height:16px;color:var(--accent);flex:none}
  .panel > .p-head .p-t{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
  .panel > .p-head .count{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;color:var(--text-dim);
    background:var(--surface-2);border:1px solid var(--border-soft);padding:1px 7px;border-radius:20px;margin-left:auto;
  }
  .panel > .p-body{padding:16px 18px}
  .panel > .p-body.flush{padding:0}

  /* nested sub-cards (org chart card + department chart card inside company card) */
  .subgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .subcard{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);overflow:hidden}
  .subcard .sc-head{
    display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--border-soft);
  }
  .subcard .sc-head svg{width:15px;height:15px;color:var(--accent);flex:none}
  .subcard .sc-head .sc-t{font-size:12.5px;font-weight:600;color:var(--text)}
  .subcard .sc-body{padding:15px}

  /* ---------- card grids ---------- */
  .grid{display:grid;gap:14px}
  .grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .grid.cols-2{grid-template-columns:repeat(2,1fr)}
  .grid.cols-4{grid-template-columns:repeat(4,1fr)}

  .tile{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:17px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;
    transition:.16s;text-decoration:none;color:inherit;
  }
  .tile:hover{background:var(--surface-hover);border-color:var(--border);transform:translateY(-1px)}
  .tile .ico{
    width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;
    background:var(--surface-2);border:1px solid var(--border-soft);
  }
  .tile .ico svg{width:20px;height:20px}
  .tile .body{min-width:0;display:flex;flex-direction:column;gap:2px}
  .tile .t{font-size:14.5px;font-weight:600;letter-spacing:-.01em;display:block}
  .tile .s{font-size:12.5px;color:var(--text-dim);display:block}
  .tile .pill{align-self:flex-start;margin-top:4px}

  /* ---------- company card (org + dept) ---------- */
  .company-card{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);
    overflow:hidden;
  }
  .company-card .cc-head{
    display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border-soft);
  }
  .company-card .cc-head .badge{
    width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none;
  }
  .company-card .cc-head .t{font-size:14.5px;font-weight:600}
  .company-card .cc-head .s{font-size:12px;color:var(--text-faint)}
  .cc-split{display:grid;grid-template-columns:1fr 1fr}
  .cc-pane{padding:16px 18px}
  .cc-pane + .cc-pane{border-left:1px solid var(--border-soft)}
  .cc-pane .pane-title{
    font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:12px;
    display:flex;align-items:center;gap:8px;
  }
  .cc-pane .pane-title svg{width:15px;height:15px;color:var(--accent)}

  /* ---------- tree ---------- */
  .tree{font-size:13px}
  .tree ul{list-style:none;margin:0;padding-left:20px;position:relative}
  .tree > ul{padding-left:4px}
  .tree li{position:relative;padding:6px 0}
  .tree ul ul li::before{
    content:"";position:absolute;top:0;bottom:50%;left:-14px;width:12px;
    border-left:1px solid var(--border);border-bottom:1px solid var(--border);
    border-bottom-left-radius:6px;
  }
  .tree ul ul li:not(:last-child)::after{
    content:"";position:absolute;top:0;bottom:-6px;left:-14px;border-left:1px solid var(--border);
  }
  .node{
    display:inline-flex;align-items:center;gap:11px;padding:10px 14px;border-radius:11px;
    background:var(--surface);border:1px solid var(--border);cursor:default;transition:.14s;
    box-shadow:var(--shadow);min-width:120px;
  }
  .node:hover{border-color:var(--accent-line);background:var(--surface-hover);transform:translateY(-1px)}
  .node .av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
  .node.root{background:var(--accent-soft);border-color:var(--accent-line)}
  .node .txt{display:flex;flex-direction:column;line-height:1.25}
  .node .nm{font-weight:600;letter-spacing:-.01em;font-size:13px}
  .node .rl{color:var(--text-faint);font-size:11px}
  .dept .node{min-width:0}
  .dept .node .av{border-radius:8px}

  /* ---------- task / lead rows ---------- */
  .rows{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden}
  .row{display:flex;align-items:center;gap:14px;padding:13px 17px;border-bottom:1px solid var(--border-soft);transition:.14s}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--surface-hover)}
  .row .check{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border);flex:none}
  .row.done .check{background:var(--green);border-color:var(--green);position:relative}
  .row.done .check::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #0c0e11;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .row .main{flex:1;min-width:0}
  .row .main .rt{font-size:13.5px;font-weight:500}
  .row.done .main .rt{color:var(--text-dim);text-decoration:line-through}
  .row .main .rs{font-size:12px;color:var(--text-faint);margin-top:1px}
  .pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .pill.blue{background:var(--accent-soft);color:#a9c4ff}
  .pill.amber{background:rgba(240,182,75,.14);color:var(--amber)}
  .pill.green{background:rgba(84,201,138,.14);color:var(--green)}
  .pill.rose{background:rgba(242,116,140,.14);color:var(--rose)}
  .pill.gray{background:var(--surface-2);color:var(--text-dim)}
  .val{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--text)}

  /* ---------- properties ---------- */
  .props{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .prop{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 17px;
  }
  .prop .k{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .prop .v{font-size:22px;font-weight:700;margin-top:8px;letter-spacing:-.02em;font-family:'JetBrains Mono',monospace}
  .prop .d{font-size:12px;margin-top:4px;color:var(--text-dim)}
  .prop .d.up{color:var(--green)}
  .prop .d.down{color:var(--rose)}

  .hidden{display:none}

  @media(max-width:860px){
    .grid.cols-3,.grid.cols-4{grid-template-columns:repeat(2,1fr)}
    .cc-split{grid-template-columns:1fr}
    .cc-pane + .cc-pane{border-left:none;border-top:1px solid var(--border-soft)}
    .props{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:520px){
    .grid.cols-3,.grid.cols-4,.grid.cols-2{grid-template-columns:1fr}
    .props{grid-template-columns:1fr}
    header.top{align-items:flex-start}
  }
</style>
</head>
<body>
<div class="shell">

  <header class="top">
    <div class="brand">
      <div class="logo">LW</div>
      <div>
        <h1>Leavenwealth Group</h1>
        <span>Company portal &amp; dashboards</span>
      </div>
    </div>
    <div class="controls">
      <div class="view-toggle" role="tablist">
        <button id="tab-all" class="active" onclick="setView('all')"><span class="dot"></span>All Data</button>
        <button id="tab-single" onclick="setView('single')"><span class="dot"></span>Single</button>
      </div>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme"></button>
      <button class="acct" onclick="openSettings()" title="Account" aria-label="Account">AV<span class="status"></span></button>
    </div>
  </header>

  <!-- settings popup -->
  <div class="overlay" id="settings" onclick="if(event.target===this)closeSettings()">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="m-top">
        <span class="m-av">AV</span>
        <div><div class="m-nm">Alex Vance</div><div class="m-em">alex@leavenwealth.com</div></div>
        <button class="m-x" onclick="closeSettings()" aria-label="Close">&times;</button>
      </div>
      <div class="m-sec">
        <div class="m-label">Appearance</div>
        <div class="m-row" style="cursor:default">
          ${''}<span id="apr-ico"></span> Theme
          <div class="seg" id="themeSeg">
            <button data-theme-set="light" onclick="setTheme('light')">${''}<span class="seg-ic-l"></span>Light</button>
            <button data-theme-set="dark" onclick="setTheme('dark')">${''}<span class="seg-ic-d"></span>Dark</button>
          </div>
        </div>
      </div>
      <div class="m-sec">
        <div class="m-label">Account</div>
        <div class="m-row" data-ic="user">Profile <span class="chev">&rsaquo;</span></div>
        <div class="m-row" data-ic="bell">Notifications <span class="chev">&rsaquo;</span></div>
        <div class="m-row" data-ic="users">Team &amp; members <span class="chev">&rsaquo;</span></div>
        <div class="m-row" data-ic="card">Billing <span class="chev">&rsaquo;</span></div>
      </div>
      <div class="m-sec" style="border-top:1px solid var(--border-soft)">
        <div class="m-row danger" data-ic="out">Sign out</div>
      </div>
    </div>
  </div>

  <!-- business tabs, only in single view -->
  <div class="biz-bar hidden" id="bizBar"></div>

  <main id="content"></main>
</div>

<script>
/* ============================ ICONS ============================ */
const I = {
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M17 8.2a3 3 0 0 1 0 5.6M18.5 20a5 5 0 0 0-3-4.6"/></svg>',
  server:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><circle cx="7" cy="7.5" r=".6" fill="currentColor"/><circle cx="7" cy="16.5" r=".6" fill="currentColor"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg>',
  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V6a4 4 0 0 1 8 0v1"/></svg>',
  dollar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M16 7.5C16 6 14.2 5 12 5S8 6 8 7.8s1.8 2.6 4 3 4 1.4 4 3.2S14.2 19 12 19s-4-1-4-2.5"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
  building:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M9 16h.01M15 16h.01"/></svg>',

/* ============================ RENDER HELPERS ============================ */
function initials(name){return name.replace('&','').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();}

function treeNode(node, root=false, dept=false, colorIdx=0){
  const bg = dept?accentColor(colorIdx):(root?'#5b8cff':'#33384a');
  const av = `<span class="av" style="background:${bg}">${initials(node.n)}</span>`;
  const role = node.r ? `<span class="rl">${node.r}</span>` : '';
  const inner = `<span class="node ${root?'root':''}">${av}<span class="txt"><span class="nm">${node.n}</span>${role}</span></span>`;
  if(node.c && node.c.length){
    const kids = node.c.map((c,i)=>`<li>${treeNode(c,false,dept,i)}</li>`).join('');
    return `${inner}<ul>${kids}</ul>`;
  }
  return inner;
}
function orgTree(root){return `<div class="tree"><ul><li>${treeNode(root,true,false)}</li></ul></div>`;}
function deptTree(root){return `<div class="tree dept"><ul><li>${treeNode(root,true,true)}</li></ul></div>`;}

/* generic card wrapper for every section */
function panel(icon, title, count, body, flush=false){
  return `
  <div class="panel">
    <div class="p-head">
      <span class="p-ic">${icon}</span>
      <span class="p-t">${title}</span>
      ${count!=null?`<span class="count">${count}</span>`:''}
    </div>
    <div class="p-body${flush?' flush':''}">${body}</div>
  </div>`;
}

/* Company card: two tiles — Organization chart + Department chart */
function companyCard(name, color, org, dept){
  const deptCount = dept.c ? dept.c.length : 0;
  const body = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:15px">
      <span class="badge" style="background:${color};width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px">${initials(name)}</span>
      <div><div style="font-size:14px;font-weight:600">${name}</div><div style="font-size:12px;color:var(--text-faint)">Structure &amp; departments</div></div>
    </div>
    <div class="grid cols-2">
      <a class="tile">
        <span class="ico" style="color:var(--accent)">${I.org}</span>
        <span class="body"><span class="t">Organization chart</span><span class="s">Reporting structure</span></span>
      </a>
      <a class="tile">
        <span class="ico" style="color:var(--accent)">${I.tree}</span>
        <span class="body"><span class="t">Department chart</span><span class="s">${deptCount} departments</span></span>
      </a>
    </div>`;
  return panel(I.building, 'Company', null, body);
}

function tiles(items){
  return `<div class="grid cols-3">${items.map(([ic,t,s])=>`
    <a class="tile">
      <span class="ico" style="color:var(--accent)">${I[ic]||I.dash}</span>
      <span class="body"><span class="t">${t}</span><span class="s">${s}</span></span>
    </a>`).join('')}</div>`;
}

function taskTiles(tasks){
  return `<div class="grid cols-3">${tasks.map(([t,s,pc,pl,,done])=>`
    <div class="tile">
      <span class="ico" style="color:${done?'var(--green)':'var(--accent)'}">${done?I.check:I.target}</span>
      <span class="body"><span class="t">${t}</span><span class="s">${s}</span><span class="pill ${pc}">${pl}</span></span>
    </div>`).join('')}</div>`;
}

function leadTiles(leads){
  return `<div class="grid cols-3">${leads.map(([n,stage,pc,val])=>`
    <div class="tile">
      <span class="ico" style="color:var(--accent)">${I.dollar}</span>
      <span class="body"><span class="t">${n}</span><span class="s">${val}</span><span class="pill ${pc}">${stage}</span></span>
    </div>`).join('')}</div>`;
}

function propTiles(props){
  return `<div class="grid cols-4">${props.map(([ic,k,v,d,dc])=>`
    <div class="tile">
      <span class="ico" style="color:var(--accent)">${I[ic]}</span>
      <span class="body"><span class="t">${k}</span><span class="s"><span class="val" style="font-size:15px">${v}</span></span><span class="s ${dc||''}" style="${dc==='up'?'color:var(--green)':dc==='down'?'color:var(--rose)':''}">${d}</span></span>
    </div>`).join('')}</div>`;
}

/* ============================ STATE ============================ */
let view='all', activeBiz=businesses[0].id;

function buildBizBar(){
  document.getElementById('bizBar').innerHTML = businesses.map(b=>`
    <button class="biz-tab ${b.id===activeBiz?'active':''}" onclick="setBiz('${b.id}')">
      <span class="glyph" style="background:${b.color}">${b.short}</span>${b.name}
    </button>`).join('');
}

function render(){
  const c=document.getElementById('content');
  const bar=document.getElementById('bizBar');
  if(view==='all'){
    bar.classList.add('hidden');
    c.innerHTML=renderAll();
  }else{
    bar.classList.remove('hidden');
    buildBizBar();
    c.innerHTML=renderSingle(businesses.find(b=>b.id===activeBiz));
  }
}
function setView(v){
  view=v;
  document.getElementById('tab-all').classList.toggle('active',v==='all');
  document.getElementById('tab-single').classList.toggle('active',v==='single');
  render();
}
function setBiz(id){activeBiz=id;render();}

/* ---------- theme ---------- */
let theme='dark';
function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').innerHTML = theme==='dark' ? I.sun : I.moon;
  document.querySelectorAll('#themeSeg button').forEach(b=>{
    b.classList.toggle('on', b.dataset.themeSet===theme);
  });
  document.querySelectorAll('.seg-ic-l').forEach(e=>e.innerHTML=I.sun);
  document.querySelectorAll('.seg-ic-d').forEach(e=>e.innerHTML=I.moon);
  const apr=document.getElementById('apr-ico'); if(apr) apr.innerHTML = theme==='dark'?I.moon:I.sun;
}
function toggleTheme(){theme = theme==='dark'?'light':'dark';applyTheme();}
function setTheme(t){theme=t;applyTheme();}

/* ---------- settings popup ---------- */
function openSettings(){document.getElementById('settings').classList.add('open');}
function closeSettings(){document.getElementById('settings').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSettings();});
/* inject icons into modal rows */
document.querySelectorAll('.m-row[data-ic]').forEach(r=>{
  r.insertAdjacentHTML('afterbegin', I[r.dataset.ic]||'');
});

applyTheme();
render();
