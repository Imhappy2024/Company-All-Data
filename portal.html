<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0e11;
    --bg-2:#101318;
    --surface:#15181e;
    --surface-2:#1a1e26;
    --surface-hover:#1e232c;
    --border:#252a33;
    --border-soft:#1e222a;
    --text:#e7eaef;
    --text-dim:#9aa1ad;
    --text-faint:#6b7280;
    --accent:#5b8cff;
    --accent-soft:rgba(91,140,255,.14);
    --accent-line:rgba(91,140,255,.35);
    --teal:#3ec7c2;
    --amber:#f0b64b;
    --green:#54c98a;
    --rose:#f2748c;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 3px rgba(0,0,0,.28);
  }
  [data-theme="light"]{
    --bg:#f3f5f8;
    --bg-2:#eceef2;
    --surface:#ffffff;
    --surface-2:#f4f6f9;
    --surface-hover:#eef1f5;
    --border:#dde1e8;
    --border-soft:#e7eaf0;
    --text:#181b21;
    --text-dim:#565d6b;
    --text-faint:#8a91a0;
    --accent:#3d6ff5;
    --accent-soft:rgba(61,111,245,.12);
    --accent-line:rgba(61,111,245,.4);
    --shadow:0 1px 3px rgba(20,30,60,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}

  /* ---------- shell ---------- */
  .shell{max-width:1180px;margin:0 auto;padding:28px 22px 80px}
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    gap:20px;flex-wrap:wrap;margin-bottom:26px;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:linear-gradient(140deg,var(--accent),#7a5bff);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;
    box-shadow:0 4px 16px rgba(91,140,255,.28);
  }
  .brand h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  .brand span{display:block;font-size:12px;color:var(--text-faint);font-weight:400}

  /* ---------- toggle ---------- */
  .view-toggle{
    display:inline-flex;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:4px;gap:2px;
  }
  .view-toggle button{
    all:unset;cursor:pointer;padding:8px 18px;border-radius:9px;
    font-size:13.5px;font-weight:500;color:var(--text-dim);
    display:flex;align-items:center;gap:8px;transition:.16s;
  }
  .view-toggle button:hover{color:var(--text)}
  .view-toggle button.active{background:var(--accent-soft);color:#bcd0ff}
  .view-toggle button.active .dot{background:var(--accent)}
  .view-toggle .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint)}

  /* header controls cluster */
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .icon-btn{
    all:unset;cursor:pointer;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);transition:.16s;
  }
  .icon-btn:hover{color:var(--text);background:var(--surface-hover);border-color:var(--border)}
  .icon-btn svg{width:19px;height:19px}
  .acct{
    all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
    color:#fff;font-weight:700;font-size:14px;background:linear-gradient(140deg,#5b8cff,#7a5bff);
    box-shadow:0 3px 12px rgba(91,140,255,.3);position:relative;transition:transform .16s;
  }
  .acct:hover{transform:scale(1.05)}
  .acct .status{position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}

  /* settings modal */
  .overlay{
    position:fixed;inset:0;background:rgba(6,8,12,.6);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;padding:70px 18px;z-index:50;
  }
  .overlay.open{display:flex;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);
    border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);
    animation:pop .2s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
  .modal .m-top{display:flex;align-items:center;gap:14px;padding:20px;border-bottom:1px solid var(--border-soft)}
  .modal .m-top .m-av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;background:linear-gradient(140deg,#5b8cff,#7a5bff);flex:none}
  .modal .m-top .m-nm{font-size:15px;font-weight:600}
  .modal .m-top .m-em{font-size:12.5px;color:var(--text-faint)}
  .modal .m-top .m-x{margin-left:auto;all:unset;cursor:pointer;color:var(--text-faint);font-size:20px;line-height:1;padding:6px}
  .modal .m-x:hover{color:var(--text)}
  .m-sec{padding:8px 12px}
  .m-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);padding:10px 8px 6px}
  .m-row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;cursor:pointer;transition:.14s;font-size:13.5px;font-weight:500}
  .m-row:hover{background:var(--surface-hover)}
  .m-row svg{width:17px;height:17px;color:var(--text-dim)}
  .m-row .chev{margin-left:auto;color:var(--text-faint)}
  .m-row.danger{color:var(--rose)}
  .m-row.danger svg{color:var(--rose)}
  /* segmented theme control inside modal */
  .seg{margin-left:auto;display:inline-flex;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:9px;padding:3px}
  .seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:500;color:var(--text-dim);display:flex;align-items:center;gap:6px}
  .seg button svg{width:14px;height:14px}
  .seg button.on{background:var(--accent-soft);color:var(--accent)}

  /* ---------- business tabs (single view) ---------- */
  .biz-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
  .biz-tab{
    all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:10px 15px;border-radius:11px;border:1px solid var(--border-soft);
    background:var(--surface);font-size:13.5px;font-weight:500;color:var(--text-dim);
    transition:.16s;
  }
  .biz-tab:hover{background:var(--surface-hover);color:var(--text)}
  .biz-tab.active{border-color:var(--accent-line);background:var(--accent-soft);color:#cdddff}
  .biz-tab .glyph{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}

  /* ---------- section ---------- */
  .eyebrow{
    font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--text-faint);margin:32px 0 13px;display:flex;align-items:center;gap:9px;
  }
  .eyebrow:first-of-type{margin-top:6px}
  .eyebrow .count{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;
    color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border-soft);
    padding:1px 7px;border-radius:20px;letter-spacing:0;text-transform:none;
  }

  /* ---------- panel card (wraps every section) ---------- */
  .panel{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);
    margin-top:16px;overflow:hidden;
  }
  .panel > .p-head{
    display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border-soft);
  }
  .panel > .p-head .p-ic{width:16px;height:16px;color:var(--accent);flex:none}
  .panel > .p-head .p-t{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
  .panel > .p-head .count{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;color:var(--text-dim);
    background:var(--surface-2);border:1px solid var(--border-soft);padding:1px 7px;border-radius:20px;margin-left:auto;
  }
  .panel > .p-body{padding:16px 18px}
  .panel > .p-body.flush{padding:0}

  /* nested sub-cards (org chart card + department chart card inside company card) */
  .subgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .subcard{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);overflow:hidden}
  .subcard .sc-head{
    display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--border-soft);
  }
  .subcard .sc-head svg{width:15px;height:15px;color:var(--accent);flex:none}
  .subcard .sc-head .sc-t{font-size:12.5px;font-weight:600;color:var(--text)}
  .subcard .sc-body{padding:15px}

  /* ---------- card grids ---------- */
  .grid{display:grid;gap:14px}
  .grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .grid.cols-2{grid-template-columns:repeat(2,1fr)}
  .grid.cols-4{grid-template-columns:repeat(4,1fr)}

  .tile{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:17px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;
    transition:.16s;text-decoration:none;color:inherit;
  }
  .tile:hover{background:var(--surface-hover);border-color:var(--border);transform:translateY(-1px)}
  .tile .ico{
    width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;
    background:var(--surface-2);border:1px solid var(--border-soft);
  }
  .tile .ico svg{width:20px;height:20px}
  .tile .body{min-width:0;display:flex;flex-direction:column;gap:2px}
  .tile .t{font-size:14.5px;font-weight:600;letter-spacing:-.01em;display:block}
  .tile .s{font-size:12.5px;color:var(--text-dim);display:block}
  .tile .pill{align-self:flex-start;margin-top:4px}

  /* ---------- company card (org + dept) ---------- */
  .company-card{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);
    overflow:hidden;
  }
  .company-card .cc-head{
    display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border-soft);
  }
  .company-card .cc-head .badge{
    width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none;
  }
  .company-card .cc-head .t{font-size:14.5px;font-weight:600}
  .company-card .cc-head .s{font-size:12px;color:var(--text-faint)}
  .cc-split{display:grid;grid-template-columns:1fr 1fr}
  .cc-pane{padding:16px 18px}
  .cc-pane + .cc-pane{border-left:1px solid var(--border-soft)}
  .cc-pane .pane-title{
    font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:12px;
    display:flex;align-items:center;gap:8px;
  }
  .cc-pane .pane-title svg{width:15px;height:15px;color:var(--accent)}

  /* ---------- tree ---------- */
  .tree{font-size:13px}
  .tree ul{list-style:none;margin:0;padding-left:20px;position:relative}
  .tree > ul{padding-left:4px}
  .tree li{position:relative;padding:6px 0}
  .tree ul ul li::before{
    content:"";position:absolute;top:0;bottom:50%;left:-14px;width:12px;
    border-left:1px solid var(--border);border-bottom:1px solid var(--border);
    border-bottom-left-radius:6px;
  }
  .tree ul ul li:not(:last-child)::after{
    content:"";position:absolute;top:0;bottom:-6px;left:-14px;border-left:1px solid var(--border);
  }
  .node{
    display:inline-flex;align-items:center;gap:11px;padding:10px 14px;border-radius:11px;
    background:var(--surface);border:1px solid var(--border);cursor:default;transition:.14s;
    box-shadow:var(--shadow);min-width:120px;
  }
  .node:hover{border-color:var(--accent-line);background:var(--surface-hover);transform:translateY(-1px)}
  .node .av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
  .node.root{background:var(--accent-soft);border-color:var(--accent-line)}
  .node .txt{display:flex;flex-direction:column;line-height:1.25}
  .node .nm{font-weight:600;letter-spacing:-.01em;font-size:13px}
  .node .rl{color:var(--text-faint);font-size:11px}
  .dept .node{min-width:0}
  .dept .node .av{border-radius:8px}

  /* ---------- task / lead rows ---------- */
  .rows{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden}
  .row{display:flex;align-items:center;gap:14px;padding:13px 17px;border-bottom:1px solid var(--border-soft);transition:.14s}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--surface-hover)}
  .row .check{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border);flex:none}
  .row.done .check{background:var(--green);border-color:var(--green);position:relative}
  .row.done .check::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #0c0e11;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .row .main{flex:1;min-width:0}
  .row .main .rt{font-size:13.5px;font-weight:500}
  .row.done .main .rt{color:var(--text-dim);text-decoration:line-through}
  .row .main .rs{font-size:12px;color:var(--text-faint);margin-top:1px}
  .pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .pill.blue{background:var(--accent-soft);color:#a9c4ff}
  .pill.amber{background:rgba(240,182,75,.14);color:var(--amber)}
  .pill.green{background:rgba(84,201,138,.14);color:var(--green)}
  .pill.rose{background:rgba(242,116,140,.14);color:var(--rose)}
  .pill.gray{background:var(--surface-2);color:var(--text-dim)}
  .val{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--text)}

  /* ---------- properties ---------- */
  .props{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .prop{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 17px;
  }
  .prop .k{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .prop .v{font-size:22px;font-weight:700;margin-top:8px;letter-spacing:-.02em;font-family:'JetBrains Mono',monospace}
  .prop .d{font-size:12px;margin-top:4px;color:var(--text-dim)}
  .prop .d.up{color:var(--green)}
  .prop .d.down{color:var(--rose)}

  /* ============ chart viewer (org / dept) ============ */
  .sheet-overlay{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:50}
  .sheet-overlay.open{display:flex;animation:fade .18s ease}
  .sheet-head{
    display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--border-soft);
    background:var(--surface);flex:none;flex-wrap:wrap;
  }
  .sheet-head .back{all:unset;cursor:pointer;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-dim);border:1px solid var(--border)}
  .sheet-head .back:hover{background:var(--surface-hover);color:var(--text)}
  .sheet-head .sh-title{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .sheet-head .sh-sub{font-size:12.5px;color:var(--text-faint)}
  .sheet-head .spacer{flex:1}
  .seg2{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
  .seg2 button{all:unset;cursor:pointer;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text-dim);display:flex;align-items:center;gap:7px}
  .seg2 button svg{width:15px;height:15px}
  .seg2 button.on{background:var(--accent-soft);color:var(--accent)}
  .sheet-body{flex:1;overflow:auto;padding:26px}

  /* org tree (top-down) */
  .orgchart{display:inline-block;min-width:100%;text-align:center}
  .orgchart ul{display:flex;justify-content:center;padding-top:22px;position:relative;margin:0;list-style:none}
  .orgchart li{list-style:none;position:relative;padding:22px 10px 0;text-align:center}
  .orgchart li::before,.orgchart li::after{content:'';position:absolute;top:0;right:50%;width:50%;height:22px;border-top:2px solid var(--border)}
  .orgchart li::after{right:auto;left:50%;border-left:2px solid var(--border)}
  .orgchart li:only-child{padding-top:22px}
  .orgchart li:only-child::before,.orgchart li:only-child::after{display:none}
  .orgchart li:first-child::before,.orgchart li:last-child::after{border:0 none}
  .orgchart li:last-child::before{border-right:2px solid var(--border);border-radius:0 8px 0 0}
  .orgchart li:first-child::after{border-radius:8px 0 0 0}
  .orgchart ul ul::before{content:'';position:absolute;top:0;left:50%;width:0;height:22px;border-left:2px solid var(--border)}
  .orgchart > ul{padding-top:0}
  .orgchart > ul > li::before,.orgchart > ul > li::after{display:none}

  .pcard{
    display:inline-flex;flex-direction:column;align-items:center;gap:7px;width:158px;padding:14px 12px;
    border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);
    cursor:pointer;transition:.15s;vertical-align:top;
  }
  .pcard:hover{border-color:var(--accent-line);transform:translateY(-2px)}
  .pcard .pav{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;position:relative}
  .pcard .pav .on{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--surface)}
  .pcard .pnm{font-size:13px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
  .pcard .ptl{font-size:11px;color:var(--text-dim);line-height:1.3}
  .pcard .pdt{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
  .deptcard{background:var(--surface-2);border-style:dashed}
  .deptcard .pnm{font-size:13.5px}

  /* list view */
  .plist{max-width:1000px;margin:0 auto;border:1px solid var(--border-soft);border-radius:14px;overflow:hidden;background:var(--surface)}
  .plist .lh,.plist .lr{display:grid;grid-template-columns:2fr 1.6fr 1.1fr 1.4fr 90px;align-items:center;gap:12px;padding:12px 18px}
  .plist .lh{border-bottom:1px solid var(--border-soft);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}
  .plist .lr{border-bottom:1px solid var(--border-soft);cursor:pointer;transition:.13s}
  .plist .lr:last-child{border-bottom:none}
  .plist .lr:hover{background:var(--surface-hover)}
  .plist .who{display:flex;align-items:center;gap:11px;min-width:0}
  .plist .who .pav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
  .plist .who .n{font-size:13.5px;font-weight:600}
  .plist .cell{font-size:13px;color:var(--text-dim)}
  .plist .tag{display:inline-flex;align-items:center;gap:7px;font-size:12.5px}
  .plist .tag .dt{width:8px;height:8px;border-radius:50%}
  .plist .tag svg{width:14px;height:14px;color:var(--text-faint)}
  .plist .contact{display:flex;gap:12px;color:var(--text-faint)}
  .plist .contact svg{width:15px;height:15px;cursor:pointer}
  .plist .contact svg:hover{color:var(--accent)}
  .list-scroll{overflow-x:auto}

  /* staff drawer */
  .drawer-back{position:fixed;inset:0;background:rgba(6,8,12,.5);display:none;z-index:60}
  .drawer-back.open{display:block;animation:fade .18s ease}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:380px;max-width:92vw;background:var(--surface);
    border-left:1px solid var(--border);z-index:70;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.3,1);
    display:flex;flex-direction:column;
  }
  .drawer.open{transform:none}
  .drawer .d-hero{padding:26px 24px;border-bottom:1px solid var(--border-soft);position:relative;text-align:center}
  .drawer .d-hero .d-x{position:absolute;top:14px;right:14px;all:unset;cursor:pointer;color:var(--text-faint);font-size:22px;line-height:1}
  .drawer .d-hero .d-x:hover{color:var(--text)}

  .drawer .d-av .on{position:absolute;bottom:3px;right:3px;width:15px;height:15px;border-radius:50%;background:var(--green);border:3px solid var(--surface)}
  .drawer .d-nm{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .drawer .d-tl{font-size:13.5px;color:var(--text-dim);margin-top:2px}
  .drawer .d-dept{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}

  .drawer .d-field{padding:14px 0;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:13px}
  .drawer .d-field:last-child{border-bottom:none}
  .drawer .d-field svg{width:17px;height:17px;color:var(--text-faint);flex:none}
  .drawer .d-field .fk{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .drawer .d-field .fv{font-size:13.5px;font-weight:500;margin-top:1px}
  .drawer .d-actions{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--border-soft);margin-top:auto}
  .drawer .d-actions button{flex:1;all:unset;cursor:pointer;text-align:center;padding:10px;border-radius:10px;font-size:13px;font-weight:600;transition:.14s}
  .drawer .d-actions .primary{background:var(--accent);color:#fff}
  .drawer .d-actions .primary:hover{filter:brightness(1.08)}
  .drawer .d-actions .ghost{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim)}

  @media(max-width:640px){

    header.top{align-items:flex-start}
  }

  /* ---------- additions for portals/dashboards ---------- */
  .portalbar{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
  .portalbar button{all:unset;cursor:pointer;padding:8px 16px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text-dim);display:flex;align-items:center;gap:8px;transition:.16s}
  .portalbar button svg{width:16px;height:16px}
  .portalbar button:hover{color:var(--text)}
  .portalbar button.active{background:var(--accent-soft);color:#bcd0ff}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 17px}
  .kpi .k{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:flex;align-items:center;gap:8px}
  .kpi .k svg{width:15px;height:15px;color:var(--accent)}
  .kpi .v{font-size:23px;font-weight:700;margin-top:9px;letter-spacing:-.02em;font-family:'JetBrains Mono',monospace}
  .kpi .d{font-size:12px;margin-top:4px;color:var(--text-dim)}
  .kpi .d.up{color:var(--green)} .kpi .d.down{color:var(--rose)}
  /* data table */
  .dtable{width:100%;border-collapse:collapse;font-size:13px}
  .dtable th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);padding:10px 14px;border-bottom:1px solid var(--border-soft);white-space:nowrap}
  .dtable td{padding:11px 14px;border-bottom:1px solid var(--border-soft);color:var(--text)}
  .dtable tr:last-child td{border-bottom:none}
  .dtable tbody tr:hover{background:var(--surface-hover)}
  .dtable .r{text-align:right;font-family:'JetBrains Mono',monospace}
  .who2{display:flex;align-items:center;gap:10px}
  .who2 img,.who2 .av2{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
  .who2 .av2{display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px}
  /* simple bar chart */
  .bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding:8px 4px 0}
  .bars .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
  .bars .bar .fill{width:100%;max-width:26px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--accent),#7a5bff);transition:.2s}
  .bars .bar .lbl{font-size:10px;color:var(--text-faint);font-family:'JetBrains Mono',monospace}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text-dim)}
  .legend .li{display:flex;align-items:center;gap:7px}
  .legend .sw{width:10px;height:10px;border-radius:3px}
  /* provider / channel chips */
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--surface-2);color:var(--text-dim)}
  .chip .sw{width:8px;height:8px;border-radius:50%}
  .up-zone{border:1.5px dashed var(--border);border-radius:14px;padding:30px;text-align:center;color:var(--text-dim);background:var(--bg-2)}
  .up-zone svg{width:30px;height:30px;color:var(--accent);margin-bottom:10px}
  .split2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.split2{grid-template-columns:1fr}}
  @media(max-width:520px){.kpis{grid-template-columns:1fr}}
  .embed{width:100%;height:calc(100vh - 150px);border:0;border-radius:12px;background:var(--surface)}
  .sec-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.sec-cards{grid-template-columns:1fr}}

/* ===== helpers ===== */
const money=n=> (n<0?'-$':'$')+Math.abs(Number(n)).toLocaleString('en-US',{maximumFractionDigits:0});
const moneyk=n=>{const a=Math.abs(n);return (n<0?'-$':'$')+(a>=1000?(a/1000).toFixed(1)+'K':a);};
const initials=n=>n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const inBrand=x=> brand==='all' || x.brand===brand;
function panel(ic,title,count,body){return `<div class="panel"><div class="p-head"><span class="p-ic">${ic}</span><span class="p-t">${title}</span>${count!=null?`<span class="count">${count}</span>`:''}</div><div class="p-body">${body}</div></div>`;}
function panelFlush(ic,title,count,body){return `<div class="panel"><div class="p-head"><span class="p-ic">${ic}</span><span class="p-t">${title}</span>${count!=null?`<span class="count">${count}</span>`:''}</div><div class="p-body flush">${body}</div></div>`;}
function kpi(ic,k,v,d,dc){return `<div class="kpi"><div class="k">${ic||''} ${k}</div><div class="v">${v}</div>${d?`<div class="d ${dc||''}">${d}</div>`:''}</div>`;}
function pill(t,c){return `<span class="pill ${c}">${t}</span>`;}
function table(head,rows){return `<div class="list-scroll"><table class="dtable"><thead><tr>${head.map(h=>`<th class="${h.r?'r':''}">${h.t}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;}

}
function renderClient(){
  const kpis=`<div class="kpis">${kpi(I.briefcase,'Active engagements','7','Folio + Leadli','')}${kpi(I.file,'Files this month','23','uploaded','up')}${kpi(I.check,'Deliverables due','3','this week','')}${kpi(I.gauge,'On-time rate','96%','','up')}</div>`;
  const up=`<div class="up-zone">${I.file}<div style="font-weight:600;color:var(--text)">Drag &amp; drop files to upload</div><div style="font-size:12.5px;margin-top:4px">Bank statements, receipts, reports · PDF, CSV, XLSX</div></div>`;
  const rows=[['June_Bank_Statement.pdf','Jenny Cruz','manual','Jul 14'],['Q2_Financials.xlsx','Automated sync','automated','Jul 12'],['Receipts_June.zip','client A','manual','Jul 10'],['Payroll_June.csv','Jenny Cruz','manual','Jul 8']]
    .map(([f,by,m,d])=>`<tr><td>${f}</td><td>${by}</td><td>${pill(m,m==='manual'?'blue':'green')}</td><td>${d}</td></tr>`).join('');
  return kpis+`<div style="margin-top:16px">${panel(I.file,'Upload',null,up)}</div>`+
    `<div style="margin-top:16px">${panelFlush(I.file,'Recent uploads','4',table([{t:'File'},{t:'Uploaded by'},{t:'Source'},{t:'Date'}],rows))}</div>`;
}

/* ===== detail sheet ===== */
const DASHBOARD_URL='/ops'; /* ops dashboard is served same-origin at /ops */
const DASH_TITLES={exec:'Executive overview',ads:'Marketing / Ads',fin:'Internal financials',pmreports:'Property financial reports',loans:'Loans',leads:'Leads',appts:'Appointments',org:'Organization chart',dept:'Department chart'};
function openSheet(){document.getElementById('detail').classList.add('open');document.body.style.overflow='hidden';}
function openDetail(id){
  document.getElementById('detailTitle').textContent=DASH_TITLES[id]||id;
  document.getElementById('detailSub').textContent = brand==='all'?'All brands':brandName(brand);
  document.getElementById('detailBody').innerHTML=RENDER[id]();
  openSheet();
}
function openEmbed(url,title){
  document.getElementById('detailTitle').textContent=title;
  document.getElementById('detailSub').textContent='Live · ops dashboard';
  document.getElementById('detailBody').innerHTML=`<div style="font-size:12.5px;color:var(--text-faint);margin-bottom:10px">Served from the operations dashboard at <span class="mono">${url}</span></div><iframe class="embed" src="${url}" title="${title}"></iframe>`;
  openSheet();
}
function closeDetail(){document.getElementById('detail').classList.remove('open');document.body.style.overflow='';}

/* ===== drawers ===== */
function openStaffCard(id){const p=STAFF.find(x=>x.id===id);drawer(`
  <div class="d-hero"><button class="d-x" onclick="closeStaff()">&times;</button>
    <img class="d-av" style="object-fit:cover" src="${p.img}" alt="">
    <div class="d-nm">${p.name}</div><div class="d-tl">${p.title}</div>
    <div class="d-dept">${brandName(p.brand)}</div></div>
  <div class="d-body">
    <div class="d-field">${I.file}<div><div class="fk">About</div><div class="fv">${p.desc}</div></div></div>
    <div class="d-field">${I.mail}<div><div class="fk">Email</div><div class="fv">${p.email}</div></div></div>
    <div class="d-field">${I.phone}<div><div class="fk">Phone</div><div class="fv">${p.phone}</div></div></div>
  </div>
  <div class="d-actions"><button class="primary">Message</button><button class="ghost">View profile</button></div>`);}
function openLead(i){const l=LEADS[i];drawer(`
  <div class="d-hero"><button class="d-x" onclick="closeStaff()">&times;</button>
    <div class="d-av" style="background:${brandColor(l.brand)}">${initials(l.name)}</div>
    <div class="d-nm">${l.name}</div><div class="d-tl">${l.stage}</div>
    <div class="d-dept">${brandName(l.brand)}</div></div>
  <div class="d-body">
    <div class="d-field">${I.target}<div><div class="fk">Provider</div><div class="fv">${PROVIDERS[l.prov].n}</div></div></div>
    <div class="d-field">${I.check}<div><div class="fk">Status</div><div class="fv">${l.status}</div></div></div>
    <div class="d-field">${I.dollar}<div><div class="fk">Value</div><div class="fv">${l.val?money(l.val):'—'}</div></div></div>
  </div>
  <div class="d-actions"><button class="primary">Open in GHL</button><button class="ghost">Log call</button></div>`);}
function drawer(html){document.getElementById('staffDrawer').innerHTML=html;document.getElementById('staffDrawer').classList.add('open');document.getElementById('drawerBack').classList.add('open');}
function closeStaff(){document.getElementById('staffDrawer').classList.remove('open');document.getElementById('drawerBack').classList.remove('open');}

/* ===== nav / render ===== */
function buildPortalbar(){document.getElementById('portalbar').innerHTML=PORTALS.map(p=>`<button class="${p.id===portal?'active':''}" onclick="setPortal('${p.id}')">${I[p.ic]}${p.t}</button>`).join('');}
function render(){buildPortalbar();const c=document.getElementById('content');c.innerHTML = portal==='ops'?renderOps():portal==='investor'?renderInvestor():renderClient();}
function setPortal(p){portal=p;render();}
function setBrand(b){brand=b;render();}

/* ===== theme / settings (from original) ===== */
let theme='dark';
function applyTheme(){document.documentElement.setAttribute('data-theme',theme);document.getElementById('themeBtn').innerHTML=theme==='dark'?I.sun:I.moon;document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.themeSet===theme));document.querySelectorAll('.seg-ic-l').forEach(e=>e.innerHTML=I.sun);document.querySelectorAll('.seg-ic-d').forEach(e=>e.innerHTML=I.moon);const apr=document.getElementById('apr-ico');if(apr)apr.innerHTML=theme==='dark'?I.moon:I.sun;}
function toggleTheme(){theme=theme==='dark'?'light':'dark';applyTheme();}
function setTheme(t){theme=t;applyTheme();}
function openSettings(){document.getElementById('settings').classList.add('open');}
function closeSettings(){document.getElementById('settings').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const d=document.getElementById('staffDrawer');if(d.classList.contains('open')){closeStaff();return;}if(document.getElementById('detail').classList.contains('open')){closeDetail();return;}closeSettings();});
document.querySelectorAll('.m-row[data-ic]').forEach(r=>r.insertAdjacentHTML('afterbegin',I[r.dataset.ic]||''));
applyTheme();render();
</script>
</body>
</html>
