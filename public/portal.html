<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeavenWealth Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- Supabase browser client (live reads; RLS-gated). Deferred + optional: if it fails
     to load, the app falls back to baked data and never breaks. -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Default to dark, set before first paint so there's no light flash. -->
<script>document.documentElement.setAttribute('data-theme','dark');</script>
<!-- Shared design system (palette, geometry, dark theme) — same file /ops uses. -->
<link rel="stylesheet" href="/tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* Palette, geometry and the dark theme now come from the shared design system in
   tokens.css (loaded above), so both / and /ops read as one product. The old
   hard-coded :root/[data-theme=dark] colour blocks were removed. --border-2 is the
   only legacy name tokens.css doesn't ship a shim for, so alias it here. */
:root{ --border-2: var(--border-strong); }
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:13.5px;line-height:1.45}
.app{display:grid;grid-template-columns:250px 1fr;height:100vh;overflow:hidden;transition:grid-template-columns .18s ease}
.app.nav-hidden{grid-template-columns:0 1fr}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}
.brandpick{padding:10px;border-bottom:1px solid var(--border)}
.bp-btn{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:var(--radius-sm);background:transparent;border:none;cursor:pointer;transition:.12s;text-align:left}
.bp-btn:hover{background:var(--panel-2)}
.bp-glyph{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:650;font-size:11.5px;letter-spacing:-.2px;flex:none}
.bp-meta{text-align:left;flex:1;min-width:0}
.bp-name{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.bp-sub{display:block;font-size:11px;color:var(--faint);line-height:1.25}
.bp-caret{color:var(--faint);flex:none}
.bp-menu{display:none;flex-direction:column;gap:1px;margin-top:6px}
.bp-menu.open{display:flex}
.bp-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:12.5px;color:var(--dim)}
.bp-item:hover{background:var(--panel-2)}
.bp-item.active{background:var(--surface-3);color:var(--text);font-weight:600}
.bp-dot{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:8.5px;flex:none}

.nav{flex:1;overflow-y:auto;padding:8px}
.nav::-webkit-scrollbar{width:8px}.nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.nav-lbl{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:12px 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer;color:var(--dim);font-size:13px;font-weight:500;transition:.12s;position:relative;width:100%}
.nav-item svg{width:16px;height:16px;flex:none;opacity:.8}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:var(--surface-3);color:var(--text);font-weight:600}
.nav-item .badge{margin-left:auto;font-size:11px;font-weight:500;background:none;color:var(--faint);padding:0;border-radius:0;font-variant-numeric:tabular-nums}
.nav-item.active .badge{background:none;color:var(--dim)}
.side-foot{border-top:1px solid var(--border);padding:8px 10px;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
.avatar.mono{display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:700;font-size:11px}

/* main */
.main{overflow-y:auto;height:100vh}
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;gap:14px}
.crumb{font-size:13px;color:var(--faint)}.crumb b{color:var(--text);font-weight:600}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;color:var(--faint);font-size:12.5px;min-width:200px;cursor:text;transition:.12s}
.search:hover{border-color:var(--border-2)}
.search svg{width:14px;height:14px}
.tb-actions{display:flex;align-items:center;gap:6px}
.tb-btn{width:29px;height:29px;border-radius:var(--radius-sm);border:none;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--dim);padding:0;box-sizing:border-box}
.tb-btn:hover{background:var(--panel-2);color:var(--text)}
.tb-btn svg{width:16px;height:16px}
.content{padding:20px 24px 60px;max-width:1560px;margin:0 auto}
.content.wide{max-width:none}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:16px;flex-wrap:wrap}
.page-t{font-size:19px;font-weight:650;letter-spacing:-.012em}
.page-s{font-size:12.5px;color:var(--faint);margin-top:3px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:7px 13px;font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:15px;height:15px}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--border)}

/* components */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px 12px}
.kpi .k{font-size:11.5px;color:var(--dim);font-weight:550;display:flex;align-items:center;gap:6px}
.kpi .k svg{width:14px;height:14px;color:var(--dim)}
.kpi .v{font-size:25px;font-weight:640;margin-top:6px;letter-spacing:-.022em;line-height:1.12;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;margin-top:4px;color:var(--faint)}
.kpi .d.up{color:var(--green)}.kpi .d.down{color:var(--rose)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-h{padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px}
.card-h svg{width:15px;height:15px;color:var(--dim)}
.card-h .badge{margin-left:auto;font-size:11px;color:var(--faint);background:var(--panel-2);padding:1.5px 8px;border-radius:999px;font-weight:600}
.card-b{padding:12px 14px 14px}.card-b.flush{padding:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--faint);padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel-2)}
.r{text-align:right;font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:10px}
.who img,.who .mo{width:30px;height:30px;border-radius:50%;flex:none;object-fit:cover}
.who .mo{display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1.5px 8px;border-radius:999px;border:1px solid transparent}
.pill.green{background:var(--green-soft);color:var(--green)}.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}.pill.rose{background:var(--rose-soft);color:var(--rose)}
.pill.gray{background:var(--panel-2);color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--panel-2);color:var(--dim)}
.chip .sw{width:8px;height:8px;border-radius:50%}
.tilegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ptile{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:.12s}
.ptile:hover{border-color:var(--border-2);background:var(--panel-2)}
.ptile .pt{font-weight:600;font-size:14px}
.ptile .ps{font-size:12px;color:var(--faint);margin:3px 0 10px}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.person{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 13px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:.12s}
.person:hover{border-color:var(--border-2);background:var(--panel-2)}
.person img{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}
.person .pn{font-weight:600;font-size:13px}.person .pr{font-size:11.5px;color:var(--faint);margin-top:2px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.col{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:10px}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:6px 8px 10px}
.col-h .cnt{color:var(--faint);font-weight:600}
.col-add{margin-left:auto;color:var(--faint);cursor:pointer}.col-add svg{width:14px;height:14px}
.col-dot{width:8px;height:8px;border-radius:50%;flex:none}
.tcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px;margin-bottom:8px;cursor:pointer;transition:.12s}
.tcard:hover{border-color:var(--border-2);background:var(--panel-2)}
.tcard .tt{font-weight:600;font-size:13.5px;margin:8px 0;line-height:1.35}
.tcard .tf{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--faint);text-transform:capitalize}
.tcard .tf svg{width:13px;height:13px}
.tcard .tf .due{margin-left:auto;display:flex;align-items:center;gap:6px}
.prio{width:8px;height:8px;border-radius:50%;flex:none}
.miniav{width:22px;height:22px;border-radius:50%;object-fit:cover}
@media(max-width:900px){.board{grid-template-columns:1fr}}
.segbtn{all:unset;cursor:pointer;padding:4px 12px;border-radius:4px;font-size:12.5px;font-weight:500;color:var(--faint)}
.segbtn.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 0 0 1px var(--border-2)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px;gap:0;margin-bottom:14px}
.orgwrap{overflow-x:auto;padding:6px 2px 10px}
.org{display:inline-flex;flex-direction:column;align-items:center;min-width:100%}
.org-level{display:flex;justify-content:center;gap:18px;flex-wrap:nowrap}
.onode{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:190px;position:relative;transition:.12s}
.onode:hover{border-color:var(--border-2);background:var(--panel-2)}
.onode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.onode img{width:36px;height:36px;border-radius:9px;object-fit:cover;flex:none}
.onode .on{font-weight:600;font-size:13px;white-space:nowrap}
.onode .or{font-size:11px;color:var(--dim);white-space:nowrap}
.org-trunk{width:2px;height:22px;background:var(--border)}
.org-children{position:relative;display:flex;justify-content:center;gap:16px;flex-wrap:nowrap;padding-top:22px}
.org-children::before{content:"";position:absolute;top:0;left:9%;right:9%;height:2px;background:var(--border)}
.org-children>.onode::before{content:"";position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:2px;height:22px;background:var(--border)}
.deptgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.deptcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.deptcard .dh{padding:12px 14px;border-bottom:1px solid var(--border-2);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.deptcard .dh .cnt{margin-left:auto;font-size:11px;color:var(--faint);font-weight:600}
.deptcard .dm{padding:9px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px}
.deptcard .dm:hover{background:var(--panel-2)}
.deptcard .dm img{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
.deptcard .dm .lead{margin-left:auto;font-size:10px;color:var(--accent);font-weight:700;letter-spacing:.03em}
@media(max-width:900px){.deptgrid{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.bars .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .bar .fill{width:100%;max-width:22px;border-radius:5px 5px 0 0;background:var(--accent)}
.bars .bar .bl{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.selectbox{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font:600 13px Inter,sans-serif;color:var(--text);cursor:pointer}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,161,80,.5)}70%{box-shadow:0 0 0 6px rgba(18,161,80,0)}100%{box-shadow:0 0 0 0 rgba(18,161,80,0)}}
.muted{font-size:12.5px;color:var(--faint)}
.embedframe{width:100%;height:calc(100vh - 120px);min-height:460px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);display:block}
.embedhost{padding:0 28px 28px}
.content.embed-lean{padding:14px 28px 0}
.placeholder{background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);padding:44px;text-align:center;color:var(--faint)}
.placeholder svg{width:34px;height:34px;margin-bottom:12px;color:var(--accent-line)}

/* drawer (profile) */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.35);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:390px;max-width:92vw;background:var(--panel);border-left:1px solid var(--border);transform:translateX(100%);transition:.24s cubic-bezier(.4,0,.2,1);z-index:41;overflow-y:auto}
.drawer.open{transform:none}
.dr-hero{padding:26px 24px 20px;text-align:center;border-bottom:1px solid var(--border-2);position:relative}
.dr-x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:18px;color:var(--dim);line-height:1}
.dr-av{width:80px;height:80px;border-radius:20px;object-fit:cover;margin:0 auto 12px;display:block}
.dr-nm{font-size:18px;font-weight:700}
.dr-rl{font-size:13px;color:var(--accent);font-weight:600;margin-top:3px}
.dr-tag{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:600;background:var(--panel-2);color:var(--dim);padding:3px 11px;border-radius:20px}
.dr-b{padding:20px 24px}
.dr-sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.bio{font-size:13.5px;line-height:1.55;color:var(--text)}
.bio.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bio-toggle{margin-top:7px;background:none;border:none;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent);padding:0}
.dr-field{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--border-2);font-size:13.5px}
.dr-field svg{width:16px;height:16px;color:var(--faint);flex:none}
.dr-field .fk{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
@media(max-width:900px){.app{grid-template-columns:64px 1fr}.bp-meta,.nav-lbl,.nav-item span:not(.badge),.bp-name,.bp-sub,.bp-caret{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g3,.tilegrid,.people{grid-template-columns:1fr}}
</style></head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brandpick">
      <button class="bp-btn" onclick="document.getElementById('bpMenu').classList.toggle('open')">
        <span class="bp-glyph" id="bpGlyph">LW</span>
        <span class="bp-meta"><span class="bp-name" id="bpName">LeavenWealth</span><span class="bp-sub"></span></span>
        <span class="bp-caret"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5 8 10.5 12 6.5"/></svg></span>
      </button>
      <div class="bp-menu" id="bpMenu"></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="avatar mono">CP</div>
      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">Chris Pomerleau</div><div style="font-size:11px;color:var(--faint)">Owner &middot; Admin</div></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="tb-btn" id="navToggle" onclick="toggleSidebar()" title="Hide menu" aria-label="Toggle menu"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6.2 3v10"/></svg></button>
      <div class="crumb"><b id="cbBrand">LeavenWealth</b> <span id="cbView"></span></div>
      <div class="search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7.2" cy="7.2" r="4.4"/><path d="M10.6 10.6 14 14"/></svg><span style="flex:1">Search or jump to&hellip;</span><span style="border:1px solid var(--border-2);border-radius:4px;padding:1px 5px;font-size:10.5px;color:var(--faint)">&#8984;K</span></div>
      <div class="tb-actions">
        <div class="tb-btn" onclick="refreshCurrent()" title="Refresh"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.2v3h-3"/></svg></div>
        <div class="tb-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme"></div>
        <div class="tb-btn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5a3.5 3.5 0 0 1 7 0c0 3 1.2 3.8 1.2 3.8H3.3s1.2-.8 1.2-3.8"/><path d="M6.5 12.6a1.5 1.5 0 0 0 3 0"/></svg></div>
      </div>
    </div>
    <div class="content" id="content"></div>
    <div class="embedhost" id="embedHost" hidden></div>
  </main>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"></aside>

<script>
/* Thin-line icon set (16x16, 1.4 stroke, round caps) to match the shared design. */
const _IW='viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"';
const _svg=(p,w)=>`<svg ${w?_IW.replace('1.4',w):_IW}>${p}</svg>`;
const I={
  home:_svg('<path d="M2.5 6.6 8 2.5l5.5 4.1V13a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5z"/>'),
  grid:_svg('<rect x="2.2" y="2.2" width="4.6" height="4.6" rx="1"/><rect x="9.2" y="2.2" width="4.6" height="4.6" rx="1"/><rect x="2.2" y="9.2" width="4.6" height="4.6" rx="1"/><rect x="9.2" y="9.2" width="4.6" height="4.6" rx="1"/>'),
  check:_svg('<path d="M3 8.6l3 3 7-7.2"/>'),
  target:_svg('<circle cx="8" cy="8" r="5.6"/><circle cx="8" cy="8" r="2.5"/>'),

/* ---- Loans (live from Supabase via /api/loans) ---- */
let loansCache=null;   // cached loans; only refetched when force=true (Refresh button)
async function loadLoans(force){
  const el=document.getElementById('loansBody'); if(!el) return;
  if(loansCache && !force){ el.innerHTML=renderLoans(loansCache); return; }
  try{
    const r=await fetch('/api/loans',{headers:{'Accept':'application/json'}});
    let data=null; try{ data=await r.json(); }catch(_){}
    if(!r.ok) throw new Error((data&&data.error)?data.error:('HTTP '+r.status));
    if(data && data.error) throw new Error(data.error);
    loansCache=(data&&data.loans)||[];
    el.innerHTML=renderLoans(loansCache);
  }catch(e){
    el.innerHTML=`<div class="muted" style="color:var(--rose);padding:10px 2px">Couldn't load loans (${esc(e.message)}). Needs DATA_SOURCE=supabase + a valid SUPABASE_DB_URL on the server. <a href="/api/loans" target="_blank" style="color:var(--accent)">/api/loans</a></div>`;
  }
}
function loanPillClass(s){const x=String(s||'').toLowerCase();if(x==='active'||x==='current')return 'green';if(x==='pending')return 'amber';return 'gray';}
function renderLoans(loans){
  if(!loans.length) return `<div class="placeholder">${I.bank}<div>No loans found in Supabase.</div></div>`;
  const num=v=>(v==null||v==='')?null:Number(v);
  const total=loans.reduce((a,l)=>a+(num(l.currentDebt)||0),0);
  const rated=loans.filter(l=>num(l.interestRatePct)!=null);
  const avg=rated.length?(rated.reduce((a,l)=>a+num(l.interestRatePct),0)/rated.length).toFixed(2)+'%':'—';
  const mats=loans.map(l=>l.maturityDate).filter(Boolean).sort();
  const active=loans.filter(l=>String(l.status||'').toLowerCase()==='active').length;
  const kpis=`<div class="kpis">${kpi('bank','Total debt',moneyk(total),loans.length+' loans')}${kpi('gauge','Avg rate',avg,'')}${kpi('cal','Next maturity',mats.length?mats[0]:'—','')}${kpi('check','Active',active,'of '+loans.length)}</div>`;
  const rows=loans.slice().sort((a,b)=>(num(b.currentDebt)||0)-(num(a.currentDebt)||0)).map(l=>{
    const nm=l.name||l.lender||l.loanNumber||('Loan '+String(l.id).slice(0,8));
    const sub=[l.lender,l.positionLabel].filter(Boolean).map(esc).join(' &middot; ');
    const debt=num(l.currentDebt)!=null?money(num(l.currentDebt)):'—';
    const rate=num(l.interestRatePct)!=null?num(l.interestRatePct)+'%':'—';
    return `<tr><td>${esc(nm)}${sub?`<div style="font-size:11px;color:var(--faint)">${sub}</div>`:''}</td><td class="r">${debt}</td><td class="r">${rate}</td><td>${l.maturityDate||'—'}</td><td>${pill(l.status||'None',loanPillClass(l.status))}</td></tr>`;
  }).join('');
  return kpis+card('bank','Loan book',loans.length,tbl([{t:'Loan'},{t:'Current debt',r:1},{t:'Rate',r:1},{t:'Maturity'},{t:'Status'}],rows),true);
}

/* ---- Marketing / Ads (live meta_ads_insight via Supabase; baked fallback) ---- */
let adsCampaign='all', adsRows=null, adsMode='baked', adsFetched=false, adsBrandKey=null;
function setAdsCampaign(v){adsCampaign=v;const el=document.getElementById('adsBody');if(el)el.innerHTML=renderAdsBody();}
function adShortDay(d){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d||''));if(!m)return String(d||'');return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1]+' '+(+m[3]);}
function adsScopedRows(){
  if(adsMode==='live'&&adsRows){
    return {source:'live',rows:adsRows.map(r=>({date:String(r.date_start),spend:+r.spend||0,imp:+r.impressions||0,clicks:+r.clicks||0,leads:+r.leads||0,cid:String(r.campaign_id),cname:r.campaign_name||('Campaign '+r.campaign_id)}))};
  }
  const camps=ADS_CAMPAIGNS.filter(c=>brand==='all'||c.brand===brand);
  const rows=[];
  camps.forEach(c=>c.days.forEach(d=>rows.push({date:d.date,spend:d.spend,imp:d.imp,clicks:d.clicks,leads:d.leads,cid:c.id,cname:c.name})));
  return {source:'baked',rows};
}
async function loadAds(force){
  const el=document.getElementById('adsBody'); if(!el) return;
  if(adsFetched && adsBrandKey===brand && !force){ el.innerHTML=renderAdsBody(); return; }  // cached
  const sb=getSb(); let session=null;
  if(sb){ try{ session=(await sb.auth.getSession()).data.session; }catch(e){} }
  if(!sb||!session){ adsRows=null; adsMode='baked'; adsFetched=true; adsBrandKey=brand; el.innerHTML=renderAdsBody(); return; }
  el.innerHTML=`<div class="muted" style="padding:12px 2px">Loading ad data&hellip;</div>`;
  try{
    const since=new Date(Date.now()-13*864e5).toISOString().slice(0,10);
    let q=sb.from('meta_ads_insight').select('date_start,spend,impressions,clicks,inline_link_clicks,leads,cost_per_lead,cpm,cpc,ctr,campaign_id,campaign_name').gte('date_start',since);
    const cid=brandCompanyId(brand); if(cid) q=q.eq('company_id',cid);
    const {data,error}=await q;
    if(error) throw error;
    adsRows=data||[]; adsMode='live';
  }catch(e){ adsRows=null; adsMode='baked'; }
  adsFetched=true; adsBrandKey=brand;
  el.innerHTML=renderAdsBody();
}
function renderAdsBody(){
  const {source,rows}=adsScopedRows();
  if(!rows.length) return `<div class="placeholder">${I.trend}<div>No ad data for ${brand==='all'?'this date range':esc(BRANDS[brand].name)} yet</div></div>`;
  const campMap=new Map(); rows.forEach(r=>{if(!campMap.has(r.cid))campMap.set(r.cid,r.cname);});
  if(adsCampaign!=='all'&&!campMap.has(adsCampaign)) adsCampaign='all';
  const scoped=adsCampaign==='all'?rows:rows.filter(r=>r.cid===adsCampaign);
  const spend=scoped.reduce((a,r)=>a+r.spend,0), leads=scoped.reduce((a,r)=>a+r.leads,0);
  const imp=scoped.reduce((a,r)=>a+r.imp,0), clicks=scoped.reduce((a,r)=>a+r.clicks,0);
  const cpl=leads?spend/leads:0, ctr=imp?(clicks/imp)*100:0;
  const kpis=`<div class="kpis">${kpi('dollar','Spend (14d)',money(spend),source==='live'?'live':'sample')}${kpi('target','Leads (14d)',leads,'','up')}${kpi('trend','Avg CPL',leads?money(cpl):'—','','down')}${kpi('gauge','Avg CTR',imp?ctr.toFixed(2)+'%':'—','')}</div>`;
  const opts=['<option value="all">All campaigns</option>'].concat([...campMap.entries()].map(([id,nm])=>`<option value="${esc(id)}"${adsCampaign===id?' selected':''}>${esc(nm)}</option>`)).join('');
  const srcLabel=source==='live'?'Live &middot; meta_ads_insight <span class="livedot" title="Live from Supabase"></span>':'Sample data';
  const controls=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap"><select class="selectbox" onchange="setAdsCampaign(this.value)">${opts}</select><span class="muted" style="display:inline-flex;align-items:center;gap:6px">${srcLabel}</span></div>`;
  const byDate=new Map(); scoped.forEach(r=>byDate.set(r.date,(byDate.get(r.date)||0)+r.spend));
  const dates=[...byDate.keys()].sort();
  const bars=barChart(dates.map(d=>[adShortDay(d).replace(/^\w+ /,''),byDate.get(d),'var(--accent)']));
  let tblHtml;
  if(adsCampaign==='all'){
    const per=new Map();
    rows.forEach(r=>{const p=per.get(r.cid)||{name:r.cname,spend:0,imp:0,clicks:0,leads:0};p.spend+=r.spend;p.imp+=r.imp;p.clicks+=r.clicks;p.leads+=r.leads;per.set(r.cid,p);});
    const trs=[...per.entries()].map(([id,p])=>`<tr onclick="setAdsCampaign('${esc(id)}')" style="cursor:pointer"><td>${esc(p.name)}</td><td class="r">${money(p.spend)}</td><td class="r">${p.imp.toLocaleString()}</td><td class="r">${p.clicks.toLocaleString()}</td><td class="r">${p.leads}</td><td class="r">${p.leads?money(p.spend/p.leads):'—'}</td></tr>`).join('');
    tblHtml=card('grid','By campaign',per.size,tbl([{t:'Campaign'},{t:'Spend',r:1},{t:'Impr.',r:1},{t:'Clicks',r:1},{t:'Leads',r:1},{t:'CPL',r:1}],trs),true);
  }else{
    const trs=scoped.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(r=>`<tr><td>${esc(adShortDay(r.date))}</td><td class="r">${money(r.spend)}</td><td class="r">${r.imp.toLocaleString()}</td><td class="r">${r.clicks.toLocaleString()}</td><td class="r">${r.leads}</td><td class="r">${r.leads?money(r.spend/r.leads):'—'}</td></tr>`).join('');
    tblHtml=card('grid','Campaign: '+esc(campMap.get(adsCampaign)||'Campaign'),scoped.length,tbl([{t:'Date'},{t:'Spend',r:1},{t:'Impr.',r:1},{t:'Clicks',r:1},{t:'Leads',r:1},{t:'CPL',r:1}],trs),true);
  }
  return kpis+controls+card('trend','Daily spend',null,bars)+`<div style="height:16px"></div>`+tblHtml;
}

/* ---- profile drawer ---- */
function openStaff(id){const p=STAFF.find(s=>s.id===id);if(!p)return;
  document.getElementById('drawer').innerHTML=`
    <div class="dr-hero"><button class="dr-x" onclick="closeDrawer()">&times;</button>
      <img class="dr-av" src="${p.img}" alt=""><div class="dr-nm">${esc(p.name)}</div><div class="dr-rl">${esc(p.role)}</div><div class="dr-tag">${esc(BRANDS[p.brand].name)}</div></div>
    <div class="dr-b">
      <div class="dr-sec">About</div>
      <div class="bio clamp" id="bioText">${esc(p.bio)}</div>
      <button class="bio-toggle" id="bioToggle" onclick="toggleBio()">See more</button>
      <div style="height:8px"></div>
      <div class="dr-field">${I.mail}<div><div class="fk">Email</div><div>${esc(p.email)}</div></div></div>
      <div class="dr-field">${I.phone}<div><div class="fk">Phone</div><div>${esc(p.phone)}</div></div></div>
    </div>`;
  document.getElementById('drawer').classList.add('open');document.getElementById('scrim').classList.add('open');
  requestAnimationFrame(()=>{const t=document.getElementById('bioText'),b=document.getElementById('bioToggle');if(t&&b){t.classList.add('clamp');b.textContent='See more';b.style.display=(t.scrollHeight<=t.clientHeight+2)?'none':'';}});
}
function toggleBio(){const t=document.getElementById('bioText'),b=document.getElementById('bioToggle');if(!t||!b)return;const clamped=t.classList.toggle('clamp');b.textContent=clamped?'See more':'See less';}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('open');}

/* ---- nav / render ---- */
function applyAccent(){const b=BRANDS[brand];const soft=theme==='dark'?b.color+'26':b.soft;const line=theme==='dark'?b.color+'59':b.line;document.documentElement.style.setProperty('--accent',b.color);document.documentElement.style.setProperty('--accent-soft',soft);document.documentElement.style.setProperty('--accent-line',line);}
/* Switcher subtitle. Counts come from /api/org/summary — never hard-coded.
   Until the fetch lands (or if it fails) the subtitle is blank rather than a guess. */
function switcherSub(){
  if(!orgSummary) return '';
  const t = orgSummary.tenants && orgSummary.tenants[0];
  if(brand === 'all'){
    const c = orgSummary.company_count, n = orgSummary.tenant_count;
    return `${c} ${c === 1 ? 'company' : 'companies'} · ${n} ${n === 1 ? 'tenant' : 'tenants'}`;
  }
  return `1 company · ${t ? t.name : ''}`;
}
function buildBrandMenu(){document.getElementById('bpMenu').innerHTML=Object.entries(BRANDS).map(([id,b])=>`<div class="bp-item ${id===brand?'active':''}" onclick="setBrand('${id}')"><span class="bp-dot" style="background:${b.color}">${b.short}</span>${b.name}</div>`).join('');}
function buildNav(){const items=MENUS[brand];document.getElementById('nav').innerHTML=items.map(it=>it.lbl?`<div class="nav-lbl">${it.lbl}</div>`:`<div class="nav-item ${it.id===view?'active':''}" onclick="setView('${it.id}')">${I[it.ic]}<span>${it.label}</span>${it.badge?`<span class="badge">${it.badge}</span>`:''}</div>`).join('');}
function currentItem(){return (MENUS[brand]||[]).find(x=>x.id===view)||null;}
function currentLabel(){const it=currentItem();return it?it.label:view;}
function tasksSub(){return (brand!=='leavenwealth'&&tasksTab==='ptasks')?'overview':tasksTab;}
function isEmbedView(){
  if(view==='properties'||view==='alltasks') return true;
  if(view==='loans'&&loansTab==='views') return true;
  if(view==='tasks'){const s=tasksSub();if(s==='ptasks')return true;if((s==='overview'||s==='all')&&brandSpaces(brand).length)return true;}
  return false;
}
/* Persistent iframes (kept alive across navigation so switching views never reloads/refetches the ops). */
function embedInfo(){
  const th=`&theme=${theme}`;
  if(view==='properties') return {key:'properties',src:`${OPS_URL}#tab=properties&embed=1${th}`,title:'Properties'};
  if(view==='tasks'){
    const s=tasksSub();
    if(s==='ptasks') return {key:'ptasks',src:`${OPS_URL}#tab=properties&sub=tasks&embed=1&bare=1${th}`,title:'Property Tasks'};
    if((s==='overview'||s==='all')&&brandSpaces(brand).length){
      const sp=brandSpaces(brand).join(',');
      const opsTab=s==='overview'?'overview':'alltasks';
      return {key:`btasks-${s}-${brand}`,src:`${OPS_URL}#tab=${opsTab}&embed=1&spaces=${sp}${th}`,title:s==='overview'?'Tasks Overview':'Tasks'};
    }
  }
  if(view==='loans'&&loansTab==='views') return {key:'loanviews',src:`${OPS_URL}#tab=loanviews&embed=1${th}`,title:'Loan Views'};
  if(view==='alltasks'){
    const cur=OPS_TABS.find(t=>t[0]===opsTab)||OPS_TABS[1];
    const sp=EXEC_SPACES.join(',');
    return {key:'ops-'+cur[0],src:`${OPS_URL}#tab=${cur[0]}&embed=1&spaces=${sp}${th}`,title:cur[1]};
  }
  return null;
}
function showEmbed(info){
  const host=document.getElementById('embedHost');
  let f=host.querySelector('iframe[data-key="'+info.key+'"]');
  if(!f){f=document.createElement('iframe');f.className='embedframe';f.setAttribute('data-key',info.key);f.title=info.title;f.loading='lazy';f.src=info.src;host.appendChild(f);}
  Array.prototype.forEach.call(host.children,function(c){c.style.display=(c===f)?'':'none';});
}
function hideAllEmbeds(){const host=document.getElementById('embedHost');if(host)Array.prototype.forEach.call(host.children,function(c){c.style.display='none';});}
function render(){
  applyAccent();buildBrandMenu();buildNav();
  const b=BRANDS[brand];
  document.getElementById('bpGlyph').style.background='var(--ink)';document.getElementById('bpGlyph').style.color='var(--surface)';document.getElementById('bpGlyph').textContent=b.short;
  document.getElementById('bpName').textContent=b.name;
  document.querySelector('.bp-sub').textContent = switcherSub();
  document.getElementById('cbBrand').textContent=b.name;
  document.getElementById('cbView').textContent=' / '+currentLabel();
  const content=document.getElementById('content');
  const host=document.getElementById('embedHost');
  const embed=isEmbedView();
  const info=embed?embedInfo():null;
  content.className='content'+(embed?' wide embed-lean':'');
  const pageH=embed?'':`<div class="page-h"><div><div class="page-t">${currentLabel()}</div><div class="page-s">${b.name}</div></div><button class="btn">${I.plus} New</button></div>`;
  content.innerHTML=pageH+(V[view]?V[view]():`<div class="placeholder">${I.grid}<div>${currentLabel()}</div></div>`);
  if(embed && info){ showEmbed(info); host.hidden=false; }
  else { host.hidden=true; hideAllEmbeds(); }
}
function setBrand(id){brand=id;const m=MENUS[id];const first=m.find(x=>x.id);view=first?first.id:'overview';tasksTab='overview';document.getElementById('bpMenu').classList.remove('open');render();}
function setView(id){view=id;if(id!=='tasks')tasksTab='overview';render();}
document.documentElement.setAttribute('data-theme',theme);
document.getElementById('themeBtn').innerHTML=theme==='dark'?I.sun:I.moon;
/* Workspace-switcher counts: fetch once on boot, re-render when they land. */
fetch('/api/org/summary').then(r => r.ok ? r.json() : null).then(d => {
  if (d && !d.error) { orgSummary = d; render(); }
}).catch(() => {});
render();
restoreSidebar();
</script>
</body></html>
