<!DOCTYPE html>
<html lang="en" data-theme="light" data-density="comfortable"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeavenWealth Group</title>
<script>try{var t=localStorage.getItem('lw-theme');if(t)document.documentElement.setAttribute('data-theme',t);
var d=localStorage.getItem('lw-density');if(d)document.documentElement.setAttribute('data-density',d);}catch(e){}</script>
<link rel="stylesheet" href="/tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page);color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--s1);text-decoration:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;overflow:hidden;transition:grid-template-columns .2s ease-out}
.app[data-rail="1"]{--sidebar-w:56px}

/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.side-top{padding:10px;border-bottom:1px solid var(--border);position:relative}
.ws{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:var(--r-md);text-align:left;min-width:0}
.ws:hover{background:var(--surface-2)}
.ws-mark{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:650;font-size:11px;flex:0 0 auto}
.ws-txt{min-width:0;flex:1;display:block;overflow:hidden}
.ws-name{display:block;font-weight:600;font-size:12.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-sub{display:block;font-size:11px;color:var(--ink-3);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-menu{display:none;position:absolute;left:10px;right:10px;top:52px;z-index:40;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--r-md);box-shadow:var(--shadow-pop);padding:5px}
.ws-menu.open{display:block}
.ws-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:var(--r-sm);font-size:12.5px;text-align:left}
.ws-item:hover{background:var(--surface-2)}
.ws-item.on{background:var(--surface-3);font-weight:600}
.ws-dot{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:8.5px;flex:0 0 auto}
.nav{padding:8px;overflow-y:auto;flex:1}
.nav-lbl{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:12px 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:var(--r-sm);color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item[aria-current=page]{background:var(--surface-3);color:var(--ink);font-weight:550}
.nav-item svg{flex:0 0 auto;opacity:.85}
.nav-item .cnt{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav-item .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--crit)}
.side-foot{padding:8px;border-top:1px solid var(--border)}
[data-rail="1"] .ws-txt,[data-rail="1"] .nav-lbl,[data-rail="1"] .nav-item span,[data-rail="1"] .nav-item .cnt{display:none}
[data-rail="1"] .nav-item{justify-content:center;padding:8px}
[data-rail="1"] .ws{justify-content:center;padding:7px 0}

/* main */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.icon-btn{width:29px;height:29px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 16px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--border)}
.ctl{display:flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.ctl:hover{border-color:var(--border-strong)}
.ctl select{border:none;background:none;outline:none;font-size:12.5px}
.ctl.on{border-color:var(--s1);color:var(--s1);background:var(--s1-soft)}
.meta{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.scroll{overflow-y:auto;flex:1}
.wrap{padding:18px 16px 60px;max-width:1560px;margin:0 auto}
.page-head{margin:0 0 16px}
.page-head h1{margin:0 0 3px;font-size:19px;font-weight:650;letter-spacing:-.012em}
.page-head p{margin:0;color:var(--ink-3);font-size:12.5px;max-width:78ch}

.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.mt{margin-top:12px}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2,.g23{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.app{grid-template-columns:0 1fr}}

/* panels */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.panel-h{display:flex;align-items:flex-start;gap:10px;padding:12px 14px 10px}
.panel-h h2{margin:0;font-size:13.5px;font-weight:600}
.panel-h p{margin:2px 0 0;font-size:11.5px;color:var(--ink-3)}
.panel-b{padding:0 14px 14px}
.panel-b.flush{padding:0}
.panel-f{padding:9px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface-2)}

/* kpi */
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px 14px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.kpi-l{font-size:11.5px;color:var(--ink-2);font-weight:550;display:flex;align-items:center;gap:5px}
.kpi-v{font-size:25px;font-weight:640;letter-spacing:-.022em;line-height:1.12}
.kpi-v.sm{font-size:18px}
.kpi-s{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:11.5px}
.delta.up{color:var(--good-ink)}.delta.dn{color:var(--crit-ink)}.delta.flat{color:var(--ink-3)}

/* tables */
.tw{overflow:auto}
.tw.cap{max-height:520px}
table.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.dt th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;font-weight:600;font-size:11px;
  letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);padding:0 10px;height:32px;white-space:nowrap;
  border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
table.dt th:hover{color:var(--ink)}
table.dt th.r,table.dt td.r{text-align:right}
table.dt th .ar{opacity:.45;margin-left:3px}
table.dt th[aria-sort] .ar{opacity:1;color:var(--s1)}
table.dt td{padding:0 10px;height:var(--row-h);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
table.dt tbody tr:hover td{background:var(--surface-2)}
table.dt tfoot td{position:sticky;bottom:0;background:var(--surface-2);font-weight:650;border-top:1px solid var(--border-strong);border-bottom:none;height:34px}

/* states */
.empty{padding:38px 18px;text-align:center;color:var(--ink-3);font-size:12.5px}
.empty b{display:block;color:var(--ink-2);font-size:13.5px;margin-bottom:4px}
.empty code{background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:11.5px}
.err{padding:14px;border:1px solid color-mix(in srgb,var(--crit) 35%,transparent);background:var(--crit-soft);
  color:var(--crit-ink);border-radius:var(--r-md);font-size:12.5px}
.err b{display:block;margin-bottom:3px}
.sk{background:var(--surface-3);border-radius:5px;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.note{display:flex;gap:9px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);font-size:12px;color:var(--ink-2);align-items:flex-start}
.note svg{flex:0 0 auto;margin-top:1px;color:var(--ink-3)}
.note b{color:var(--ink)}
.prov{font-size:11px;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.ax{font-size:10.5px;fill:var(--ink-3)}
.gl{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.bl{stroke:var(--border-strong);stroke-width:1;shape-rendering:crispEdges}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 0 9px;font-size:11.5px;color:var(--ink-2)}
.legend i{width:9px;height:9px;border-radius:2.5px;display:inline-block;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--r-md);box-shadow:var(--shadow-pop);padding:8px 10px;font-size:12px;min-width:130px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip .th{font-weight:640;margin-bottom:5px}
.tip .tr{display:flex;gap:7px;justify-content:space-between;line-height:1.7;align-items:center}
.tip .tr i{width:8px;height:8px;border-radius:2px;display:inline-block}
.tip .tr b{font-variant-numeric:tabular-nums}
.tip .tn{color:var(--ink-3);font-size:11px;margin-top:4px;padding-top:4px;border-top:1px solid var(--border)}
.bars{display:flex;flex-direction:column;gap:9px;padding-top:2px}
.bh-l{display:flex;justify-content:space-between;font-size:12px;gap:10px}
.bh-l span{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bh-l b{font-variant-numeric:tabular-nums;flex:0 0 auto}
.bh-t{height:7px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:3px}
.bh-t i{display:block;height:100%;border-radius:3px;background:var(--s1)}

/* attention list */
.attlist{display:flex;flex-direction:column}
.att{display:flex;align-items:center;gap:11px;padding:10px 14px;border-top:1px solid var(--border);text-align:left;width:100%}
.att:first-child{border-top:none}
.att:hover{background:var(--surface-2)}
.att-ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}
.att-ic.crit{background:var(--crit-soft);color:var(--crit)}
.att-ic.warn{background:var(--warn-soft);color:var(--warn-ink)}
.att-ic.info{background:var(--s1-soft);color:var(--s1)}
.att-t{flex:1;min-width:0}
.att-t b{display:block;font-size:12.8px;font-weight:600}
.att-t span{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-v{text-align:right;flex:0 0 auto}
.att-v b{display:block;font-size:13px;font-weight:640}
.att-v span{display:block;font-size:11px;color:var(--ink-3)}

/* segmented control */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px;margin-bottom:14px}
.seg button{padding:4px 12px;border-radius:4px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--border-strong)}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.person{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);text-align:left;width:100%}
.person:hover{border-color:var(--border-strong);background:var(--surface-2)}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--s1);color:#fff;display:grid;place-items:center;font-weight:650;font-size:12px}
.pn{font-weight:600;font-size:13px}
.pr{font-size:11.5px;color:var(--ink-3)}

/* org / dept chart */
.orgwrap{overflow-x:auto;padding:6px 2px 14px}
.orgrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.orgnode{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:10px 12px;min-width:170px;text-align:center}
.orgnode .pn{font-size:12.5px}
.deptcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px}
.deptcard h4{margin:0 0 2px;font-size:13px;font-weight:640}
.deptcard .sub{font-size:11.5px;color:var(--ink-3);margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:11.5px}

/* embed host */
#embedHost{display:none;position:absolute;inset:0}
#embedHost.on{display:block}
#embedHost iframe{width:100%;height:100%;border:0;display:none;background:var(--page)}
#embedHost iframe.on{display:block}
.embedwrap{position:relative;flex:1;min-height:0}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(11,11,11,.28);z-index:90;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);background:var(--surface);border-left:1px solid var(--border);
  z-index:95;transform:translateX(100%);transition:transform .22s ease-out;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.dr-h h3{margin:0;font-size:15px;font-weight:640}
.dr-h p{margin:2px 0 0;font-size:11.5px;color:var(--ink-3)}
.dr-b{overflow-y:auto;padding:14px 16px 40px;flex:1}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:12.5px;margin:0 0 16px}
.dl dt{color:var(--ink-3)}
.dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.sec-t{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.hr{height:1px;background:var(--border);margin:14px 0}
</style>
</head>
<body>
<div class="app" id="app" data-rail="0">
  <aside class="side">
    <div class="side-top">
      <button class="ws" id="wsBtn" aria-haspopup="true" aria-expanded="false">
        <span class="ws-mark" id="wsMark">LW</span>
        <span class="ws-txt"><span class="ws-name" id="wsName">LeavenWealth</span><span class="ws-sub" id="wsSub">workspace</span></span>
        <span style="color:var(--ink-3);flex:0 0 auto"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5 8 10.5 12 6.5"/></svg></span>
      </button>
      <div class="ws-menu" id="wsMenu"></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <button class="nav-item" id="railBtn" title="Collapse sidebar">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6.2 3v10"/></svg><span>Collapse</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <button class="ctl" id="refreshBtn" title="Clear the server cache and refetch">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M13.6 7a5.6 5.6 0 1 0-1.3 4.2"/><path d="M13.8 3.2V7h-3.8"/></svg> Refresh
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"></button>
    </header>
    <div class="bar" id="bar"></div>
    <div class="embedwrap">
      <div class="scroll" id="scroll"><main class="wrap" id="view"></main></div>
      <div id="embedHost"></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detail"></aside>

<script>
/* =========================================================================
   LeavenWealth portal.
   Every figure on screen is fetched from /api/portal/*. There is no baked
   data in this file. If a query returns nothing, the UI says so; it never
   substitutes a plausible-looking number.
   ========================================================================= */

/* ---------- icons ---------- */
const I={
 home:'<path d="M2.5 6.6 8 2.5l5.5 4.1V13a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5z"/>',
 bldg:'<path d="M2.5 13.5v-10a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v10M9.5 6.5h3a1 1 0 0 1 1 1v6M2 13.5h12M4.8 5h2M4.8 7.5h2M4.8 10h2"/>',
 bank:'<path d="M2 6.2 8 2.6l6 3.6M3.4 6.8v5.4M6.4 6.8v5.4M9.6 6.8v5.4M12.6 6.8v5.4M2 13.4h12"/>',
 shield:'<path d="M8 2 3 4v4c0 3 2.2 5.1 5 6 2.8-.9 5-3 5-6V4z"/>',
 trend:'<path d="M2.5 13.5V8M6.2 13.5V3.5M9.9 13.5v-7M13.6 13.5v-4"/>',
 check:'<path d="M3 8.6l3 3 7-7.2"/>',
 doc:'<path d="M9 1.8H4.5a1 1 0 0 0-1 1v10.4a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V5.3zM9 1.8v3.5h3.5M6 8.5h4M6 11h4"/>',
 users:'<circle cx="6" cy="5.6" r="2.4"/><path d="M1.8 13.4c0-2.3 1.9-4.1 4.2-4.1s4.2 1.8 4.2 4.1M11 3.6a2.4 2.4 0 0 1 0 4.5M12.2 9.7c1.3.5 2.1 1.7 2.1 3.1"/>',
 org:'<rect x="5.6" y="1.8" width="4.8" height="3.4" rx="1"/><rect x="1.4" y="10.8" width="4.4" height="3.4" rx="1"/><rect x="10.2" y="10.8" width="4.4" height="3.4" rx="1"/><path d="M8 5.2v2.6M3.6 10.8V7.8h8.8v3"/>',
 wrench:'<path d="M10.6 2.4a3.6 3.6 0 0 0-4.5 4.6L2.3 10.8a1.4 1.4 0 0 0 2 2l3.8-3.8a3.6 3.6 0 0 0 4.6-4.5l-2 2-1.7-1.7z"/>',
 dollar:'<path d="M8 1.8v12.4M10.8 4.4H6.7a2 2 0 0 0 0 4h2.6a2 2 0 0 1 0 4H5"/>',
 target:'<circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.4"/>',
 cal:'<rect x="2.2" y="3.2" width="11.6" height="10.6" rx="1.4"/><path d="M2.2 6.4h11.6M5.4 1.8v2.6M10.6 1.8v2.6"/>',
 alert:'<path d="M8 5.6v3.2M8 11.2h.01M6.9 2.6 1.6 11.8a1.2 1.2 0 0 0 1.1 1.8h10.6a1.2 1.2 0 0 0 1.1-1.8L9.1 2.6a1.2 1.2 0 0 0-2.2 0z"/>',
 clock:'<circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.3 1.4"/>',
 info:'<circle cx="8" cy="8" r="6"/><path d="M8 7.4v3.4M8 5.2h.01"/>',
 x:'<path d="M4 4l8 8M12 4l-8 8"/>',
 chev:'<path d="M6 3.5 10.5 8 6 12.5"/>',
 sun:'<circle cx="8" cy="8" r="3.1"/><path d="M8 1.4v1.5M8 13.1v1.5M14.6 8h-1.5M2.9 8H1.4M12.7 3.3l-1 1M4.3 11.7l-1 1M12.7 12.7l-1-1M4.3 4.3l-1-1"/>',
 moon:'<path d="M13.4 9.6A5.8 5.8 0 0 1 6.4 2.6a5.9 5.9 0 1 0 7 7z"/>',

/* ---------- formatters ----------
   Three distinct empty states. A blank cell reads as a bug; a zero is a claim. */
const NIL='<span class="nil" title="Not reported in the database">&mdash;</span>';
const NA='<span class="na" title="Not applicable">N/A</span>';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=v=>(v===null||v===undefined||v===''||Number.isNaN(Number(v)))?null:Number(v);
function abbr(v){const a=Math.abs(v);
  if(a>=1e9)return(v/1e9).toFixed(2).replace(/\.?0+$/,'')+'B';
  if(a>=1e6)return(v/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(a>=1e3)return Math.round(v/1e3)+'K';
  return String(Math.round(v));}
/* Full precision where a figure might be verified; abbreviated where it is scanned. */
function money(v,dp=0){const n=N(v);if(n===null)return NIL;
  const b='$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
  return n<0?`(${b})`:b;}
function m$(v){const n=N(v);if(n===null)return NIL;
  const b='$'+abbr(Math.abs(n));return n<0?`(${b})`:b;}
function pct(v,dp=1){const n=N(v);return n===null?NIL:(n*100).toFixed(dp)+'%';}
function pctRaw(v,dp=1){const n=N(v);return n===null?NIL:n.toFixed(dp)+'%';}
function ratio(v,dp=2){const n=N(v);return n===null?NIL:n.toFixed(dp)+'x';}
function n0(v){const n=N(v);return n===null?NIL:n.toLocaleString('en-US');}
function dt(s){if(!s)return NIL;const d=new Date(String(s).slice(0,10)+'T00:00:00');
  return isNaN(d)?NIL:d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function dtY(s){if(!s)return NIL;const d=new Date(String(s).slice(0,10)+'T00:00:00');
  return isNaN(d)?NIL:d.toLocaleDateString('en-US',{day:'numeric',month:'short',year:'2-digit'}).replace(',','');}
function dtTime(s){if(!s)return NIL;const d=new Date(s);return isNaN(d)?NIL:
  d.toLocaleString('en-US',{month:'short',day:'numeric',year:'2-digit',hour:'numeric',minute:'2-digit'});}
const daysFrom=s=>{if(!s)return null;const d=new Date(String(s).slice(0,10)+'T00:00:00');
  return isNaN(d)?null:Math.round((d-new Date(new Date().toDateString()))/864e5);};

/* Severity is relative to a threshold, never absolute. */
const dscrSev=v=>v==null?null:v<1?'crit':v<1.25?'warn':'good';
const ltvSev=v=>v==null?null:v>.9?'crit':v>.8?'warn':'good';
const matSev=d=>d==null?null:d<0?'crit':d<=180?'warn':d<=365?'info':null;
function badge(sev,txt){const m={crit:'alert',warn:'clock',good:'check',info:'info',mute:'info'};
  return `<span class="badge ${sev}">${ic(m[sev]||'info',11)}${esc(txt)}</span>`;}

/* ---------- fetch layer ---------- */
const apiCache=new Map();
async function api(section,brand){
  const b=brand===undefined?state.brand:brand;
  const key=section+'|'+b;
  if(apiCache.has(key))return apiCache.get(key);
  const p=(async()=>{
    const r=await fetch(`/api/portal/${section}?brand=${encodeURIComponent(b||'all')}`,{headers:{Accept:'application/json'}});
    let j=null;try{j=await r.json();}catch(_){}
    if(!r.ok||!j||!j.ok){const e=new Error((j&&j.error)||('HTTP '+r.status));e.detail=j&&j.detail;e.code=j&&j.error;throw e;}
    return j;
  })();
  apiCache.set(key,p);
  p.catch(()=>apiCache.delete(key));
  return p;
}
function errorBlock(e){
  if(e.code==='database_not_configured') return `<div class="err"><b>No database connection</b>
    The portal reads every figure live. Set <code>DATA_SOURCE=supabase</code> and <code>SUPABASE_DB_URL</code>
    on the server, then reload. Nothing is shown from cache or defaults because a wrong number is worse than no number.</div>`;
  return `<div class="err"><b>Couldn't load this section</b>${esc(e.message)}${e.detail?' &middot; '+esc(e.detail):''}</div>`;
}

const legend=a=>`<div class="legend">${a.map(i=>`<span><i style="background:${i.color}"></i>${esc(i.label)}</span>`).join('')}</div>`;
const prov=t=>`<span class="prov">${ic('info',12)}${t}</span>`;
function empty(title,body){return `<div class="empty"><b>${esc(title)}</b>${body}</div>`;}
function bars(rows){const max=Math.max(...rows.map(r=>N(r.v)||0))||1;
  return `<div class="bars">${rows.map(r=>`<div><div class="bh-l"><span title="${esc(r.k)}">${esc(r.k)}</span><b>${r.disp??m$(r.v)}</b></div>
    <div class="bh-t"><i style="width:${Math.max(1.5,(N(r.v)||0)/max*100)}%;background:${r.color||'var(--s1)'}"></i></div></div>`).join('')}</div>`;}

let tipEl;
function showTip(html,x,y){if(!tipEl){tipEl=document.createElement('div');tipEl.className='tip';document.body.appendChild(tipEl);}
  tipEl.innerHTML=html;tipEl.classList.add('on');const r=tipEl.getBoundingClientRect();
  tipEl.style.left=Math.min(x+14,innerWidth-r.width-10)+'px';
  tipEl.style.top=Math.max(8,Math.min(y-12,innerHeight-r.height-10))+'px';}
const hideTip=()=>tipEl&&tipEl.classList.remove('on');
function niceMax(v,steps=4){if(!(v>0))return 1;const raw=v/steps,mag=Math.pow(10,Math.floor(Math.log10(raw)));
  return ([1,2,2.5,5,10].find(k=>raw<=k*mag)||10)*mag*steps;}

function stackedBars(el,rows,series,o={}){
  if(!el)return;const W=el.clientWidth||700,H=o.h||240,PL=54,PR=8,PT=10,PB=30;
  const iw=W-PL-PR,ih=H-PT-PB;
  const max=niceMax(Math.max(...rows.map(r=>series.reduce((s,k)=>s+(N(r[k.key])||0),0))));
  const gap=iw/rows.length,bw=Math.min(o.maxBar||60,gap*.66),y=v=>PT+ih-(v/max)*ih;
  let g='',t='';
  for(let i=0;i<=4;i++){const v=max/4*i,yy=y(v);
    t+=`<line class="gl" x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}"/><text class="ax" x="${PL-8}" y="${yy+3.5}" text-anchor="end">$${abbr(v)}</text>`;}
  rows.forEach((r,i)=>{const cx=PL+gap*i+gap/2,x=cx-bw/2;let acc=0;
    series.forEach((s,si)=>{const v=N(r[s.key])||0;if(v<=0)return;const h=(v/max)*ih,yy=y(acc+v);
      const top=series.slice(si+1).every(k=>!(N(r[k.key])>0)),rad=top?4:0;
      g+=`<path class="bar" data-b="${esc(r.bucket)}" fill="${s.color}" d="M${x} ${yy+h} L${x} ${yy+rad} Q${x} ${yy} ${x+rad} ${yy} L${x+bw-rad} ${yy} Q${x+bw} ${yy} ${x+bw} ${yy+rad} L${x+bw} ${yy+h} Z"/>`;acc+=v;});
    if(acc>0)g+=`<text class="ax" x="${cx}" y="${y(acc)-7}" text-anchor="middle" font-weight="600" fill="var(--ink-2)">$${abbr(acc)}</text>`;
    g+=`<text class="ax" x="${cx}" y="${H-10}" text-anchor="middle">${esc(r.bucket)}</text>`;
    g+=`<rect class="bar" data-b="${esc(r.bucket)}" x="${PL+gap*i}" y="${PT}" width="${gap}" height="${ih}" fill="transparent"/>`;});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'bar chart')}">${t}${g}<line class="bl" x1="${PL}" x2="${W-PR}" y1="${PT+ih}" y2="${PT+ih}"/></svg>`;
  el.querySelectorAll('[data-b]').forEach(n=>{
    n.addEventListener('mousemove',e=>{const r=rows.find(r=>String(r.bucket)===n.dataset.b);if(!r)return;
      const tot=series.reduce((s,k)=>s+(N(r[k.key])||0),0);
      showTip(`<div class="th">${esc(r.bucket)}</div>`+series.map(s=>`<div class="tr"><span><i style="background:${s.color}"></i>${s.label}</span><b>$${abbr(N(r[s.key])||0)}</b></div>`).join('')
        +`<div class="tr" style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px"><span>Total</span><b>$${abbr(tot)}</b></div>`
        +(r.note?`<div class="tn">${esc(r.note)}</div>`:''),e.clientX,e.clientY);});
    n.addEventListener('mouseleave',hideTip);});
}
function lineChart(el,rows,series,o={}){
  if(!el)return;const W=el.clientWidth||700,H=o.h||200,PL=50,PR=12,PT=12,PB=28;
  const iw=W-PL-PR,ih=H-PT-PB;
  const max=niceMax(Math.max(...rows.flatMap(r=>series.map(s=>N(r[s.key])||0))));
  const x=i=>PL+(rows.length===1?iw/2:iw*i/(rows.length-1)),y=v=>PT+ih-(v/max)*ih;
  let t='';for(let i=0;i<=4;i++){const v=max/4*i,yy=y(v);
    t+=`<line class="gl" x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}"/><text class="ax" x="${PL-8}" y="${yy+3.5}" text-anchor="end">${o.fmtAxis?o.fmtAxis(v):'$'+abbr(v)}</text>`;}
  let p='';
  series.forEach(s=>{const pts=rows.map((r,i)=>[x(i),y(N(r[s.key])||0)]);
    const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
    p+=`<path d="${d} L${x(rows.length-1)} ${PT+ih} L${x(0)} ${PT+ih} Z" fill="${s.color}" opacity=".10"/>`;
    p+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach(q=>p+=`<circle cx="${q[0]}" cy="${q[1]}" r="2.6" fill="${s.color}" stroke="var(--surface)" stroke-width="1.4"/>`);});
  let xl='';const step=Math.max(1,Math.ceil(rows.length/7));
  rows.forEach((r,i)=>{if(i%step===0||i===rows.length-1)xl+=`<text class="ax" x="${x(i)}" y="${H-9}" text-anchor="middle">${esc(o.xfmt?o.xfmt(r):r.label)}</text>`;});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'line chart')}">${t}${p}${xl}
    <line class="bl" x1="${PL}" x2="${W-PR}" y1="${PT+ih}" y2="${PT+ih}"/>
    <line id="cx" x1="0" x2="0" y1="${PT}" y2="${PT+ih}" stroke="var(--border-strong)" opacity="0"/>
    <rect x="${PL}" y="${PT}" width="${iw}" height="${ih}" fill="transparent" id="hit"/></svg>`;
  const svg=el.querySelector('svg'),hit=el.querySelector('#hit'),cx=el.querySelector('#cx');
  hit.addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(rows.length-1,Math.round((sx-PL)/iw*(rows.length-1))));
    cx.setAttribute('x1',x(i));cx.setAttribute('x2',x(i));cx.setAttribute('opacity','1');
    const row=rows[i];
    showTip(`<div class="th">${esc(o.xfmt?o.xfmt(row):row.label)}</div>`+
      series.map(s=>`<div class="tr"><span><i style="background:${s.color}"></i>${s.label}</span><b>${s.fmt?s.fmt(row[s.key]):'$'+abbr(N(row[s.key])||0)}</b></div>`).join('')+
      (row.note?`<div class="tn">${esc(row.note)}</div>`:''),e.clientX,e.clientY);});
  hit.addEventListener('mouseleave',()=>{cx.setAttribute('opacity','0');hideTip();});
}

/* sortable table */
const sortState={};
function table(id,cols,rows,o={}){
  const s=sortState[id]||(sortState[id]={k:o.sortK,dir:o.sortDir||'asc'});
  let data=rows;
  if(s.k){const c=cols.find(c=>c.k===s.k);
    if(c)data=[...rows].sort((a,b)=>{let x=c.sv?c.sv(a):a[s.k],y=c.sv?c.sv(b):b[s.k];
      if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
      if(typeof x==='string')return s.dir==='asc'?x.localeCompare(y):y.localeCompare(x);
      return s.dir==='asc'?x-y:y-x;});}
  if(!data.length)return empty(o.emptyTitle||'No rows',o.emptyBody||'');
  const head=cols.map(c=>`<th class="${c.r?'r ':''}" data-sort="${c.k}" ${s.k===c.k?`aria-sort="${s.dir==='asc'?'ascending':'descending'}"`:''} title="${esc(c.help||c.t)}">${esc(c.t)}<span class="ar">${s.k===c.k?(s.dir==='asc'?'↑':'↓'):'↕'}</span></th>`).join('');
  const body=data.map((r,i)=>`<tr data-row="${i}">${cols.map(c=>`<td class="${c.r?'r':''}">${c.f(r)}</td>`).join('')}</tr>`).join('');
  const foot=o.totals?`<tfoot><tr>${cols.map(c=>`<td class="${c.r?'r':''}">${o.totals(data)[c.k]??''}</td>`).join('')}</tr></tfoot>`:'';
  setTimeout(()=>{const t=document.getElementById(id);if(!t)return;
    t.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort;
      if(s.k===k)s.dir=s.dir==='asc'?'desc':'asc';else{s.k=k;s.dir=(cols.find(c=>c.k===k)||{}).r?'desc':'asc';}render();});
    if(o.onRow)t.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>o.onRow(data[+tr.dataset.row]));},0);
  return `<div class="tw ${o.cap?'cap':''}"><table class="dt" id="${id}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>`;
}

/* coverage sentence — printed wherever an aggregate is shown */
function coverageNote(c){
  if(!c)return '';
  return `<div class="note">${ic('info',15)}<div><b>What these figures are built from.</b>
    ${c.properties_with_financials} of ${c.properties_total} properties carry a financial snapshot, all dated ${dt(c.financials_as_of)}
    &mdash; a single observation, so no trend is drawn anywhere in this portal.
    ${c.loans_with_balance} of ${c.loans_total} loans have a recorded balance; ${c.loans_without_maturity} have no maturity date.
    ${c.policies_with_premium} of ${c.policies_total} insurance policies carry a premium.
    Blank cells mean <em>not reported</em>, never zero.</div></div>`;
}
