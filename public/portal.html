/* ===========================================================================

   tasks. For owners and admins it is the Executive board: the L10 agenda, All
   tasks, Personal tasks (their own), and Users & roles below a divider - the
   one place access is set (mcp.access_grant). Both read ClickUp with the
   person's own sign-in. */
const HOME_VIEWS=[['mine','My tasks'],['all','All tasks']];
const EXEC_VIEWS=[['l10','L10 agenda'],['all','All tasks'],['mine','Personal tasks'],['access','Users & roles']];
const HOME_ICON={mine:'mine',all:'all',l10:'overview',access:'user'};
function homeViews(){ return isAdmin()?EXEC_VIEWS:HOME_VIEWS; }
function homeName(){ return isAdmin()?'Executive board':'Home'; }
function homeDefault(){ const v=pagesByBrand.home; return homeViews().some(x=>x[0]===v)?v:homeViews()[0][0]; }

/* ---- access (dash_my_access payload, one call at boot) ------------------ */
let dashAccess=null;
const ROLE_WORD={owner:'Owner',admin:'Admin',user:'User'};
function scopeAccess(scope){ return (dashAccess&&dashAccess.access&&dashAccess.access[scope])||null; }
function navLevel(b,navId){ const m=scopeAccess(b==='exec'?'exec':brandCompanyId(b)); return (m&&m[navId])||null; }
function isAdmin(){ const r=dashAccess&&dashAccess.user&&dashAccess.user.role; return r==='owner'||r==='admin'; }
function canSeeAccess(){ return isAdmin(); }
/* Items the person can open in one business. A page they cannot open is never
   listed, so nothing ever renders "no access". */
function visibleMenu(b){
  return (MENUS[b]||[]).filter(it=>!!navLevel(b,it[2]||it[0]));
}
function itemVisible(b,id){ return visibleMenu(b).some(it=>it[0]===id); }
function allowedBizz(){ return BIZ_ORDER.filter(b=>(MENUS[b]||[]).some(it=>!!navLevel(b,it[2]||it[0]))); }
function firstAllowedView(b){ const it=visibleMenu(b)[0]; return it?it[0]:null; }

/* ---- state ---- */
let brand='home', view='mine', theme=document.documentElement.getAttribute('data-theme')||'dark';
let deptTab='list', teamFilter='all';
const pagesByBrand={};      /* last page per business, for this person */

/* ---- helpers ---- */
const money=n=>(n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>(n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0});
const moneyk=n=>{const a=Math.abs(n);return (n<0?'-$':'$')+(a>=1000?(a/1000).toFixed(1)+'K':a);};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kpi=(ic,k,v,d,dc)=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div>${d?`<div class="d ${dc||''}">${d}</div>`:''}</div>`;
const card=(ic,t,badge,body,flush)=>`<div class="card"><div class="card-h">${t}${badge!=null?`<span class="badge">${badge}</span>`:''}</div><div class="card-b ${flush?'flush':''}">${body}</div></div>`;
const tbl=(h,rows)=>`<table><thead><tr>${h.map(x=>`<th class="${x.r?'r':''}">${x.t}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
const pill=(t,c)=>`<span class="pill ${c}">${t}</span>`;
const pageHead=(t,sub,right)=>`<div class="page-h"><h1 class="page-t">${esc(t)}</h1><div style="display:flex;align-items:center;gap:12px">${sub?`<span class="page-s">${sub}</span>`:''}${right||''}</div></div>`;
const empty=(title,body)=>`<div class="placeholder"><b>${esc(title)}</b>${body?`<div class="ph-sub">${body}</div>`:''}</div>`;
const errBox=(msg,retry)=>`<div class="err-box" role="alert">${esc(msg)}${retry?` <button class="link" onclick="${retry}">Try again</button>`:''}</div>`;
function initialsOf(n){const p=String(n||'').trim().split(/\s+/).filter(Boolean);if(!p.length)return '?';return ((p[0][0]||'?')+(p.length>1?(p[p.length-1][0]||''):'')).toUpperCase();}
function staffPhoto(p,cls){const i=esc(initialsOf(p.name));if(!p.avatar_url)return `<span class="${cls}">${i}</span>`;return `<span class="${cls} has-photo">${i}<img src="${esc(p.avatar_url)}" alt="" loading="lazy" onerror="staffPhotoFailed(this)"></span>`;}
function staffPhotoFailed(img){const s=img.parentNode;if(s)s.classList.remove('has-photo');img.remove();}

/* ---- tables: sortable, frozen header, density, CSV export -------------- */
const TBL={};                      /* id -> {cols, rows, sort:{k,dir}} */
let density='comfortable';
try{density=localStorage.getItem('lwDensity')||'comfortable';}catch(e){}
/* cols: [{k, t, r(ight), fmt(row)->html, val(row)->sortable/export value}] */
function dataTable(id,cols,rows,opts){
  opts=opts||{};
  const st=TBL[id]=TBL[id]||{sort:opts.sort||null};
  st.cols=cols; st.rows=rows; st.name=opts.name||id;
  const val=(c,r)=>c.val?c.val(r):r[c.k];
  let list=rows.slice();
  if(st.sort){
    const c=cols.find(x=>x.k===st.sort.k);
    if(c){
      const d=st.sort.dir==='desc'?-1:1;
      list.sort((a,b)=>{const x=val(c,a),y=val(c,b);
        const xn=x==null||x==='', yn=y==null||y==='';
        if(xn||yn) return xn&&yn?0:(xn?1:-1);           /* nulls last, both ways */
        return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y)))*d;});
    }
  }
  const head=cols.map(c=>{
    const on=st.sort&&st.sort.k===c.k;
    const aria=on?(st.sort.dir==='desc'?'descending':'ascending'):'none';
    return `<th class="${c.r?'r':''} fin-sortable" aria-sort="${aria}" onclick="sortTable('${id}','${c.k}')">${esc(c.t)}${on?(st.sort.dir==='desc'?' ↓':' ↑'):''}</th>`;}).join('');
  const body=list.length?list.map(r=>`<tr${opts.onRow?` style="cursor:pointer" onclick="${opts.onRow(r)}"`:''}>${cols.map(c=>`<td class="${c.r?'r':''}">${c.fmt?c.fmt(r):esc(val(c,r)==null?'–':val(c,r))}</td>`).join('')}</tr>`).join('')
    :`<tr><td colspan="${cols.length}" class="muted" style="padding:18px 14px">${esc(opts.emptyText||'Nothing to show.')}</td></tr>`;
  const tools=`<div class="tbl-tools">${opts.left||''}<span class="muted">${esc(opts.caption||'')}</span><span style="flex:1"></span>
    <button class="btn ghost" onclick="toggleDensity()">${density==='compact'?'Comfortable':'Compact'}</button>
    ${rows.length?`<button class="btn ghost" onclick="exportTable('${id}')">${ico('download',14)} Export</button>`:''}</div>`;
  return tools+`<div class="frame ${density==='compact'?'compact':''}" style="max-height:${opts.maxH||'calc(100vh - 250px)'}"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function sortTable(id,k){const st=TBL[id];if(!st)return;st.sort=(st.sort&&st.sort.k===k)?{k,dir:st.sort.dir==='asc'?'desc':'asc'}:{k,dir:'asc'};render();}
function toggleDensity(){density=density==='compact'?'comfortable':'compact';try{localStorage.setItem('lwDensity',density);}catch(e){}render();}
function exportTable(id){
  const st=TBL[id];if(!st)return;
  const q=v=>{const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const lines=[st.cols.map(c=>q(c.t)).join(',')].concat(st.rows.map(r=>st.cols.map(c=>q(c.val?c.val(r):r[c.k])).join(',')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));
  a.download=st.name.replace(/[^\w-]+/g,'-').toLowerCase()+'.csv';
  document.body.appendChild(a);a.click();a.remove();
}

/* ---- data: one cached GET per URL, as the signed-in person -------------- */
const DATA={};                     /* url -> {data, err, busy} */
function getData(url){
  const e=DATA[url]=DATA[url]||{};
  if(e.data||e.busy||e.err) return e;
  e.busy=true;
  PortalLoader.hold(PortalSession.getJson(url))
    .then(d=>{e.data=d;e.err=null;e.busy=false;render();},err=>{e.err=err.message||String(err);e.busy=false;render();});
  return e;
}
function retryData(url){delete DATA[url];render();}
function dropData(prefix){Object.keys(DATA).forEach(k=>{if(k.indexOf(prefix)===0)delete DATA[k];});}
/* loading / error / ready, in one place */
function withData(url,label,fn){
  const e=getData(url);
  if(e.err) return errBox('Could not load '+label+': '+e.err,`retryData('${url}')`);
  if(!e.data) return PortalLoader.full(label);
  return fn(e.data);
}

/* ---- people (Team) ---- */
function teamFor(b,people){const cid=brandCompanyId(b);return people.filter(p=>(p.businesses||[]).some(x=>x.id===cid));}
function setTeamFilter(f){teamFilter=f;render();}
const V={};
V.team=function(){
  return withData('/api/shell/team','the team',d=>{
    const inBiz=teamFor(brand,d.people||[]);
    const shown=inBiz.filter(p=>teamFilter==='all'||(teamFilter==='emp'?p.type==='Employee':p.type==='Contractor'));
    const chips=[['all','Everyone'],['emp','Employees'],['con','Contractors']].map(([k,l])=>`<button class="chip press ${teamFilter===k?'on':''}" aria-pressed="${teamFilter===k}" onclick="setTeamFilter('${k}')">${l}</button>`).join('');
    return pageHead('Team',`${shown.length} of ${inBiz.length} people at ${esc(BRANDS[brand].name)}`)+
      dataTable('team-'+brand,[
        {k:'name',t:'Name',fmt:p=>`<span class="namecell">${staffPhoto(p,'ini')}<b>${esc(p.name)}</b></span>`},
        {k:'title',t:'Title',val:p=>p.title||null,fmt:p=>p.title?esc(p.title):'<span class="muted">No title on file</span>'},
        {k:'email',t:'Email',fmt:p=>`<span class="muted">${esc(p.email)}</span>`},
        {k:'biz',t:'Businesses',val:p=>(p.businesses||[]).map(x=>x.name).join(', ')},
        {k:'type',t:'Type',fmt:p=>`<span class="muted">${esc(p.type)}</span>`},
      ],shown,{left:`<div class="chips">${chips}</div>`,name:BRANDS[brand].name+' team',onRow:p=>`openStaff('${esc(p.id)}')`,emptyText:'Nobody here matches this filter.'});
  });
};

/* The charts encode reporting lines the database does not hold, so they stay baked;
   the department list beside them is live. */
const DEPTMEM=[{n:'Leadership',ids:[1,2]},{n:'Capital',ids:[3]},{n:'Finance',ids:[4]},{n:'Acquisitions',ids:[5]},{n:'Investor relations & risk',ids:[6]},{n:'Property management',ids:[7]},{n:'Asset management',ids:[8]}];

/* ---- URL state: brand, view, sub, plus Properties' own params ---------- */
function subOf(){ return view==='departments'?deptTab:null; }
function writeState(){
  if(!dashAccess) return;
  try{
    const p=new URLSearchParams();
    p.set('brand',brand);p.set('view',view);
    const s=subOf(); if(s) p.set('sub',s);
    if(view==='properties'&&window.PortalProps&&PortalProps.urlParams){
      const x=PortalProps.urlParams()||{};
      Object.keys(x).forEach(k=>{if(x[k]!==null&&x[k]!==undefined&&x[k]!=='')p.set(k,x[k]);});
    }
    if(view==='team'&&teamFilter!=='all') p.set('who',teamFilter);
    if(brand==='home'&&view==='l10'&&window.PortalHome) p.set('sec',PortalHome.l10Tab());
    const q=new URLSearchParams(location.search);q.delete('v');
    const qs=q.toString();
    history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+'#'+p.toString());
  }catch(e){/* a hash we cannot write is not worth breaking a render over */}
}
/* Returns true when the fragment named a place. Anything not permitted falls back
   to a page the person can open, never to a "no access" screen. */
function readState(){
  let p;
  try{const v=new URLSearchParams(location.search).get('v');p=new URLSearchParams(v||(location.hash||'').replace(/^#/,''));}catch(e){return false;}
  const b=p.get('brand'), v=p.get('view'), s=p.get('sub');
  if(!b) return false;
  /* an old link to a business's Executive board lands on the new one */
  if(v==='exec'&&isAdmin()){brand='home';view=s==='access'?'access':'l10';return true;}
  if(b==='home'){brand='home';view=homeViews().some(x=>x[0]===v)?v:homeDefault();
    if(view==='l10'&&p.get('sec')&&window.PortalHome) PortalHome.setL10Tab(p.get('sec'));return true;}
  if(!allowedBizz().includes(b)) return false;
  brand=b; view=v&&itemVisible(b,v)?v:firstAllowedView(b);
  if(view==='departments'&&s&&['list','org','dept'].includes(s)) deptTab=s;
  const w=p.get('who'); teamFilter=['emp','con'].includes(w)?w:'all';
  return true;
}

/* ---- render ---- */
function render(){
  writeState();
  if(dashAccess) writeMem();
  closeIdMenu(false);
  const app=document.getElementById('app');
  app.classList.toggle('solo',singleBiz());
  document.getElementById('rail').hidden=singleBiz();
  document.getElementById('rail').innerHTML=dashAccess?railHtml():'';
  document.getElementById('sideTitle').textContent=brand==='home'?homeName():BRANDS[brand].name;
  document.getElementById('nav').innerHTML=dashAccess?navHtml():'';
  document.getElementById('crumb').innerHTML=dashAccess?crumbHtml():'';
  const content=document.getElementById('content');
  if(!dashAccess){content.innerHTML='';return;}
  content.className='content view-in'+(view==='properties'?' props':(view==='financials'||view==='reports'||brand==='home')?' wide':'');
  if(brand==='home'){
    if(view!=='mine'&&view!=='all'&&window.PortalHome&&PortalHome.close) PortalHome.close();
    if(view==='l10'){
      content.innerHTML=pageHead('L10 agenda','Rocks, Sprint and IDS from the MASTER LIST')+'<div id="l10Native" class="l10-wrap"></div>';
      if(window.PortalHome) PortalHome.mountL10(document.getElementById('l10Native'),{onTab:writeState});
    }else if(view==='access'){
      content.innerHTML=pageHead('Users & roles')+'<div id="usersNative"></div>';
      if(window.PortalAccess&&isAdmin()) PortalAccess.mount(document.getElementById('usersNative'),{me:dashAccess.user});
    }else{
      content.innerHTML='<div id="homeNative"></div>';
      if(window.PortalHome) PortalHome.mount(document.getElementById('homeNative'),{view,title:pageLabel(),onCounts:()=>{document.getElementById('nav').innerHTML=navHtml();}});
    }
    return;
  }
  if(window.PortalHome&&PortalHome.close) PortalHome.close();   /* the task panel belongs to Home */
  content.innerHTML=V[view]?V[view]():'';
  if(view==='properties'&&window.PortalProps) PortalProps.mount(document.getElementById('reportingNative'));
  if(brand==='folio'&&view==='financials'&&window.PortalFolioFin) PortalFolioFin.mountReports(document.getElementById('folioReportsNative'));
  if(brand==='folio'&&view==='reports'&&window.PortalFolioFin) PortalFolioFin.mount(document.getElementById('folioSubsNative'));
  if(brand==='leadli'&&view==='financials'&&window.PortalLeadliFin) PortalLeadliFin.mount(document.getElementById('leadliFinNative'));
}
function goHome(v){brand='home';view=v&&homeViews().some(x=>x[0]===v)?v:homeDefault();render();}
function setBrand(b){
  if(!allowedBizz().includes(b)) return;
  brand=b;
  const last=pagesByBrand[b];
  view=last&&itemVisible(b,last)?last:firstAllowedView(b);
  document.getElementById('scroll').scrollTop=0;
  render();
}
function setView(id){
  if(brand==='home'||!itemVisible(brand,id)) return;
  view=id;document.getElementById('scroll').scrollTop=0;render();
}
/* Ctrl+0 Home, Ctrl+1..4 the businesses in rail order. */
document.addEventListener('keydown',function(e){
  if(!(e.ctrlKey||e.metaKey)||e.altKey||e.shiftKey||!dashAccess) return;
  if(!/^[0-4]$/.test(e.key)) return;
  if(e.key==='0'){e.preventDefault();goHome();return;}
  const b=allowedBizz()[Number(e.key)-1];
  if(b&&!singleBiz()){e.preventDefault();setBrand(b);}
});

  const m=document.getElementById('idMenu');
  if(!m.hidden) return closeIdMenu(true);
  const u=(dashAccess&&dashAccess.user)||{};
  m.innerHTML=`<div class="idmenu-h"><div class="idmenu-n">${esc(u.full_name||'')}</div><div class="idmenu-e">${esc(u.email||'')}</div><div class="idmenu-r">Role: ${esc(ROLE_WORD[u.role]||u.role||'')}</div></div>
    <button class="idmenu-i" role="menuitem" onclick="openProfile()">${ico('user')}<span>Profile settings</span></button>
    <button class="idmenu-i danger" role="menuitem" onclick="portalSignOut()">${ico('logout')}<span>Log out</span></button>`;
  m.hidden=false;document.getElementById('idChip').setAttribute('aria-expanded','true');
  const first=m.querySelector('.idmenu-i'); if(first) first.focus();
}
document.addEventListener('click',function(ev){
  const m=document.getElementById('idMenu');
  if(!m||m.hidden) return;
  if(ev.target.closest&&(ev.target.closest('#idMenu')||ev.target.closest('#idChip'))) return;
  closeIdMenu(false);
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Escape') return;
  const m=document.getElementById('idMenu');
  if(m&&!m.hidden) closeIdMenu(true);
  closeDrawer();
});
function openProfile(){
  closeIdMenu(false);
  if(!moduleLabels){
    moduleLabels={};
    const get=PortalSession.getJson?PortalSession.getJson('/api/access/modules'):PortalSession.client().then(c=>c.auth.getSession()).then(r=>fetch('/api/access/modules',{headers:{Authorization:'Bearer '+(r&&r.data&&r.data.session&&r.data.session.access_token)}})).then(r=>r.json());
    get.then(d=>{
      (d.modules||[]).forEach(m=>{moduleLabels[(m.company_id||'exec')+'::'+m.nav_id]=m.label;});
      if(document.getElementById('profileDrawer').classList.contains('open')) paintProfile();
    }).catch(()=>{});
  }
  document.getElementById('profileScrim').classList.add('open');
  document.getElementById('profileDrawer').classList.add('open');
  paintProfile();
}
function closeProfile(){
  document.getElementById('profileScrim').classList.remove('open');
  document.getElementById('profileDrawer').classList.remove('open');
  document.getElementById('idChip').focus();
}
function paintProfile(){
  const u=(dashAccess&&dashAccess.user)||{}, acc=(dashAccess&&dashAccess.access)||{}, companies=(dashAccess&&dashAccess.companies)||{};
  let accessHtml;
  if(u.role==='owner') accessHtml='<div class="pf-full">Full access to all workspaces.</div>';
  else{
    const scopes=Object.keys(acc);
    accessHtml=scopes.length?scopes.map(s=>{
      const name=s==='exec'?'Executive board':(companies[s]||'A business'), mods=acc[s]||{};
      return `<div class="pf-scope"><div class="pf-scope-n">${esc(name)}</div><ul>${Object.keys(mods).map(n=>`<li>${esc((moduleLabels&&moduleLabels[s+'::'+n])||n)}: ${mods[n]==='write'?'Read & Write':'Read'}</li>`).join('')}</ul></div>`;
    }).join(''):'<div class="pf-full">No access has been granted yet.</div>';
  }
  document.getElementById('profileDrawer').innerHTML=`<div class="pf-head"><div><div class="pf-t">Profile settings</div><div class="pf-s">Your account and what it can reach</div></div><button class="pf-x" onclick="closeProfile()" aria-label="Close">&#10005;</button></div>
    <div class="pf-body"><div class="pf-row"><span class="pf-k">Name</span><span class="pf-v">${esc(u.full_name||'–')}</span></div>
    <div class="pf-row"><span class="pf-k">Email</span><span class="pf-v">${esc(u.email||'–')}</span></div>
    <div class="pf-row"><span class="pf-k">Role</span><span class="pf-v">${esc(ROLE_WORD[u.role]||u.role||'–')}</span></div>
    <div class="pf-note">These are managed for you. To change your name, email or role, contact an administrator.</div>
    <div class="pf-sec">Your access</div>${accessHtml}</div>`;
}

/* ===========================================================================
   AUTH GATE, part 2 of 2: reveal for a confirmed session, otherwise /login.
   =========================================================================== */
function reveal(){ const g=document.getElementById('authGate'); if(g) g.remove(); }
function toLogin(){ location.replace('/login'); }
function showNoAccess(msg){
  document.getElementById('app').innerHTML=`<div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;padding:32px"><div style="max-width:420px;text-align:center">
    <div style="font-size:15px;font-weight:600;margin-bottom:8px">No access yet</div><div class="muted" style="line-height:1.6">${esc(msg)}</div>
    <button class="btn" style="margin-top:18px" onclick="portalSignOut()">Sign out</button></div></div>`;
  reveal();
}
function portalSignOut(){ if(!window.PortalSession) return toLogin(); PortalSession.signOut().then(toLogin,toLogin); }

if(window.PortalSession){
  PortalSession.enforceRememberWindow()
    .then(function(expired){ if(expired){ toLogin(); return null; } return PortalSession.getSession(); })
    .then(function(session){
      if(!session){ toLogin(); return null; }
      return PortalSession.access().catch(function(err){
        showNoAccess('Your access could not be loaded: '+(err&&err.message||err)+' If this persists, contact an administrator.');
        return undefined;
      });
    })
    .then(function(a){
      if(a===undefined||a===null) return;
      dashAccess=a;
      if(!a.user){ showNoAccess('Your account can sign in, but no dashboard access has been granted to it yet. Contact an administrator to be given access.'); return; }
      if(!allowedBizz().length){ showNoAccess('No business access has been granted to your account yet. Contact an administrator to be given access to a business.'); return; }
      /* Memory first, the URL over it: a shared link still lands where it points. */
      const mem=readMem();
      if(mem&&mem.pages) Object.assign(pagesByBrand,mem.pages);
      if(!readState()){
        if(mem&&mem.last&&mem.last!=='home'&&allowedBizz().includes(mem.last)) setBrandQuiet(mem.last);
        else { brand='home'; view=homeDefault(); }
      }
      personTheme();
      personSide();
      renderIdentity();
      render();
      reveal();
    })
    .catch(function(){ toLogin(); });
  PortalSession.client().then(function(c){ c.auth.onAuthStateChange(function(ev){ if(ev==='SIGNED_OUT') portalSignOut(); }); }).catch(function(){});
}else{
  toLogin();
}
function setBrandQuiet(b){ brand=b; const last=pagesByBrand[b]; view=last&&itemVisible(b,last)?last:firstAllowedView(b); }
</script>
</body></html>
