<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeavenWealth Group</title>
<!-- Remove any stale service worker BEFORE anything else runs. This used to live
     inline in index.html, so it only healed people who opened /ops; most people only
     ever see the portal at "/". See portal-sw-cleanup.js. -->
<script src="/portal-sw-cleanup.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- Supabase browser client (live reads; RLS-gated). Deferred + optional: if it fails
     to load, the app falls back to baked data and never breaks. -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Default to dark, set before first paint so there's no light flash. -->
<script>document.documentElement.setAttribute('data-theme','dark');</script>
<!-- AUTH GATE, part 1 of 2. This hides the shell before the first paint, so a
     signed-out visitor never sees a frame of dashboard content on the way to
     /login. The rest of the page still builds behind it; portal-session.js
     removes this style once a session is confirmed, or redirects instead.
     Deleting this style tag without also removing the reveal in the boot script
     leaves the app permanently invisible. -->
<style id="authGate">body{visibility:hidden}</style>
<!-- Shared design system (palette, geometry, dark theme) — same file /ops uses. -->
<link rel="stylesheet" href="/tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* Palette, geometry and the dark theme now come from the shared design system in
   tokens.css (loaded above), so both / and /ops read as one product. The old
   hard-coded :root/[data-theme=dark] colour blocks were removed. --border-2 is the
   only legacy name tokens.css doesn't ship a shim for, so alias it here. */
:root{ --border-2: var(--border-strong); }
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:13.5px;line-height:1.45}
.app{display:grid;grid-template-columns:250px 1fr;height:100vh;overflow:hidden;transition:grid-template-columns .18s ease}
.app.nav-hidden{grid-template-columns:0 1fr}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}
.brandpick{padding:10px;border-bottom:1px solid var(--border)}
.bp-btn{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:var(--radius-sm);background:transparent;border:none;cursor:pointer;transition:.12s;text-align:left}
.bp-btn:hover{background:var(--panel-2)}
.bp-glyph{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:650;font-size:11.5px;letter-spacing:-.2px;flex:none}
/* Brand marks are artwork in fixed brand colours, so they get a white plate
   rather than the tinted initials chip - a dark mark on the dark theme's panel
   would otherwise disappear. */
.bp-glyph.has-logo,.bp-dot.has-logo{background:#fff;overflow:hidden;box-sizing:border-box}
.bp-glyph.has-logo{padding:4px}
.bp-dot.has-logo{padding:2px}
.bp-glyph.has-logo img,.bp-dot.has-logo img{width:100%;height:100%;object-fit:contain;display:block}
.bp-meta{text-align:left;flex:1;min-width:0}
.bp-name{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.bp-sub{display:block;font-size:11px;color:var(--faint);line-height:1.25}
/* Live-sync mark. Deliberately quiet: this fires whenever anyone edits anything. */
.rt-stamp{font-size:11px;color:var(--faint);align-self:center;margin-right:6px;white-space:nowrap}
.bp-caret{color:var(--faint);flex:none}
.bp-menu{display:none;flex-direction:column;gap:1px;margin-top:6px}
.bp-menu.open{display:flex}
.bp-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:12.5px;color:var(--dim)}
.bp-item:hover{background:var(--panel-2)}
.bp-item.active{background:var(--surface-3);color:var(--text);font-weight:600}
.bp-dot{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:8.5px;flex:none}

.nav{flex:1;overflow-y:auto;padding:8px}
.nav::-webkit-scrollbar{width:8px}.nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.nav-lbl{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:12px 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer;color:var(--dim);font-size:13px;font-weight:500;transition:.12s;position:relative;width:100%}
.nav-item svg{width:16px;height:16px;flex:none;opacity:.8}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:var(--surface-3);color:var(--text);font-weight:600}
.nav-item .badge{margin-left:auto;font-size:11px;font-weight:500;background:none;color:var(--faint);padding:0;border-radius:0;font-variant-numeric:tabular-nums}
.nav-item.active .badge{background:none;color:var(--dim)}
.side-foot{border-top:1px solid var(--border);padding:8px 10px;position:relative}
/* The one identity control. A button because its menu contains Log out. */
.idchip{width:100%;display:flex;align-items:center;gap:10px;padding:4px;border:none;border-radius:9px;
  background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.idchip:hover{background:var(--surface-2,var(--panel-2))}
.idchip-t{flex:1;min-width:0}
.idchip-n{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idchip-r{display:block;font-size:11px;color:var(--text3,var(--faint))}
.idmenu{position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);z-index:60;padding:5px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow-lg,0 18px 50px -12px rgba(0,0,0,.5))}
.idmenu[hidden]{display:none}
.idmenu-h{padding:8px 9px 9px;border-bottom:1px solid var(--border);margin-bottom:5px}
.idmenu-n{font-size:13px;font-weight:650;overflow-wrap:anywhere}
.idmenu-e{font-size:11.5px;color:var(--text3,var(--faint));overflow-wrap:anywhere}
.idmenu-r{font-size:11.5px;color:var(--text2);margin-top:3px}
/* An _svg() icon carries a viewBox and no intrinsic size, so without this rule it
   renders at the SVG default (300x150) and each menu row becomes a tall block with a
   wrapped label. Every other icon context declares its own size - .nav-item svg,
   .tb-btn svg, .btn svg - and this menu was the only one inheriting nothing.
   Same metrics as .nav-item, so the menu reads as a continuation of the sidebar. */
.idmenu svg{width:16px;height:16px;flex:none;opacity:.8}
.idmenu-i{display:flex;align-items:center;gap:9px;width:100%;min-height:32px;padding:0 9px;
  border:none;border-radius:7px;background:none;color:var(--text);font:inherit;font-size:12.5px;
  line-height:1.2;text-align:left;white-space:nowrap;cursor:pointer}
.idmenu-i span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.idmenu-i:hover,.idmenu-i:focus{background:var(--surface-2,var(--panel-2));outline:none}
/* Destructive, so it keeps the red. */
.idmenu-i.danger{color:var(--crit-ink,var(--red,#d03b3b))}
.idmenu-i.danger svg{opacity:1}
/* Profile panel */
.pf-head{display:flex;align-items:flex-start;gap:10px;padding:20px 22px 14px;border-bottom:1px solid var(--border)}
.pf-t{font-size:16px;font-weight:650}
.pf-s{font-size:12px;color:var(--text3);margin-top:2px}
.pf-x{margin-left:auto;background:none;border:none;color:var(--text3);font-size:14px;cursor:pointer;padding:2px 6px}
.pf-body{padding:16px 22px 26px}
.pf-row{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.pf-k{width:70px;flex:none;color:var(--text3)}
.pf-v{color:var(--text);overflow-wrap:anywhere}
.pf-note{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--surface-2,var(--panel-2));
  font-size:12px;color:var(--text2);line-height:1.55}
.pf-sec{margin:20px 0 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3)}
.pf-full{font-size:13px;color:var(--text2)}
.pf-scope{margin-bottom:12px}
.pf-scope-n{font-size:12.5px;font-weight:650;margin-bottom:3px}
.pf-scope ul{margin:0 0 0 16px;padding:0}
.pf-scope li{font-size:12.5px;color:var(--text2);margin:2px 0}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
.avatar.mono{display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:700;font-size:11px}

/* main */
.main{overflow-y:auto;height:100vh}
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;gap:14px}
.crumb{font-size:13px;color:var(--faint)}.crumb b{color:var(--text);font-weight:600}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;color:var(--faint);font-size:12.5px;min-width:200px;cursor:text;transition:.12s}
.search:hover{border-color:var(--border-2)}
.search svg{width:14px;height:14px}
.tb-actions{display:flex;align-items:center;gap:6px}
.tb-btn{width:29px;height:29px;border-radius:var(--radius-sm);border:none;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--dim);padding:0;box-sizing:border-box}
.tb-btn:hover{background:var(--panel-2);color:var(--text)}
.tb-btn svg{width:16px;height:16px}
.content{padding:20px 24px 60px;max-width:1560px;margin:0 auto}
.content.wide{max-width:none}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:16px;flex-wrap:wrap}
.page-t{font-size:19px;font-weight:650;letter-spacing:-.012em}
.page-s{font-size:12.5px;color:var(--faint);margin-top:3px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:7px 13px;font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:15px;height:15px}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--border)}

/* components */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px 12px}
.kpi .k{font-size:11.5px;color:var(--dim);font-weight:550;display:flex;align-items:center;gap:6px}
.kpi .k svg{width:14px;height:14px;color:var(--dim)}
.kpi .v{font-size:25px;font-weight:640;margin-top:6px;letter-spacing:-.022em;line-height:1.12;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;margin-top:4px;color:var(--faint)}
.kpi .d.up{color:var(--green)}.kpi .d.down{color:var(--rose)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-h{padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px}
.card-h svg{width:15px;height:15px;color:var(--dim)}
.card-h .badge{margin-left:auto;font-size:11px;color:var(--faint);background:var(--panel-2);padding:1.5px 8px;border-radius:999px;font-weight:600}
.card-b{padding:12px 14px 14px}.card-b.flush{padding:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--faint);padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel-2)}
.r{text-align:right;font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:10px}
.who img,.who .mo{width:30px;height:30px;border-radius:50%;flex:none;object-fit:cover}
.who .mo{display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1.5px 8px;border-radius:999px;border:1px solid transparent}
.pill.green{background:var(--green-soft);color:var(--green)}.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}.pill.rose{background:var(--rose-soft);color:var(--rose)}
.pill.gray{background:var(--panel-2);color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--panel-2);color:var(--dim)}
.chip .sw{width:8px;height:8px;border-radius:50%}
.tilegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ptile{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:.12s}
.ptile:hover{border-color:var(--border-2);background:var(--panel-2)}
.ptile .pt{font-weight:600;font-size:14px}
.ptile .ps{font-size:12px;color:var(--faint);margin:3px 0 10px}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.person{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 13px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:.12s}
.person:hover{border-color:var(--border-2);background:var(--panel-2)}
.person img{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}
.person .pn{font-weight:600;font-size:13px}.person .pr{font-size:11.5px;color:var(--faint);margin-top:2px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.col{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:10px}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:6px 8px 10px}
.col-h .cnt{color:var(--faint);font-weight:600}
.col-add{margin-left:auto;color:var(--faint);cursor:pointer}.col-add svg{width:14px;height:14px}
.col-dot{width:8px;height:8px;border-radius:50%;flex:none}
.tcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px;margin-bottom:8px;cursor:pointer;transition:.12s}
.tcard:hover{border-color:var(--border-2);background:var(--panel-2)}
.tcard .tt{font-weight:600;font-size:13.5px;margin:8px 0;line-height:1.35}
.tcard .tf{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--faint);text-transform:capitalize}
.tcard .tf svg{width:13px;height:13px}
.tcard .tf .due{margin-left:auto;display:flex;align-items:center;gap:6px}
.prio{width:8px;height:8px;border-radius:50%;flex:none}
.miniav{width:22px;height:22px;border-radius:50%;object-fit:cover}
@media(max-width:900px){.board{grid-template-columns:1fr}}
.segbtn{all:unset;cursor:pointer;padding:4px 12px;border-radius:4px;font-size:12.5px;font-weight:500;color:var(--faint)}
.segbtn.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 0 0 1px var(--border-2)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px;gap:0;margin-bottom:14px}
.orgwrap{overflow-x:auto;padding:6px 2px 10px}
.org{display:inline-flex;flex-direction:column;align-items:center;min-width:100%}
.org-level{display:flex;justify-content:center;gap:18px;flex-wrap:nowrap}
.onode{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:190px;position:relative;transition:.12s}
.onode:hover{border-color:var(--border-2);background:var(--panel-2)}
.onode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.onode img{width:36px;height:36px;border-radius:9px;object-fit:cover;flex:none}
.onode .on{font-weight:600;font-size:13px;white-space:nowrap}
.onode .or{font-size:11px;color:var(--dim);white-space:nowrap}
.org-trunk{width:2px;height:22px;background:var(--border)}
.org-children{position:relative;display:flex;justify-content:center;gap:16px;flex-wrap:nowrap;padding-top:22px}
.org-children::before{content:"";position:absolute;top:0;left:9%;right:9%;height:2px;background:var(--border)}
.org-children>.onode::before{content:"";position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:2px;height:22px;background:var(--border)}
.deptgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.deptcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.deptcard .dh{padding:12px 14px;border-bottom:1px solid var(--border-2);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.deptcard .dh .cnt{margin-left:auto;font-size:11px;color:var(--faint);font-weight:600}
.deptcard .dm{padding:9px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px}
.deptcard .dm:hover{background:var(--panel-2)}
.deptcard .dm img{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
.deptcard .dm .lead{margin-left:auto;font-size:10px;color:var(--accent);font-weight:700;letter-spacing:.03em}
@media(max-width:900px){.deptgrid{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.bars .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .bar .fill{width:100%;max-width:22px;border-radius:5px 5px 0 0;background:var(--accent)}
.bars .bar .bl{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.selectbox{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font:600 13px Inter,sans-serif;color:var(--text);cursor:pointer}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,161,80,.5)}70%{box-shadow:0 0 0 6px rgba(18,161,80,0)}100%{box-shadow:0 0 0 0 rgba(18,161,80,0)}}
.muted{font-size:12.5px;color:var(--faint)}
.embedframe{width:100%;height:calc(100vh - 120px);min-height:460px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);display:block}
.embedhost{padding:0 28px 28px}
.content.embed-lean{padding:14px 28px 0}
.placeholder{background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);padding:44px;text-align:center;color:var(--faint)}
.placeholder svg{width:34px;height:34px;margin-bottom:12px;color:var(--accent-line)}

/* drawer (profile) */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.35);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:390px;max-width:92vw;background:var(--panel);border-left:1px solid var(--border);transform:translateX(100%);transition:.24s cubic-bezier(.4,0,.2,1);z-index:41;overflow-y:auto}
.drawer.open{transform:none}
.dr-hero{padding:26px 24px 20px;text-align:center;border-bottom:1px solid var(--border-2);position:relative}
.dr-x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:18px;color:var(--dim);line-height:1}
/* .dr-av and .pav are SPANS holding initials, with the photo layered over the top -
   so a headshot that fails to load leaves the chip rather than an empty square. */
.dr-av{width:80px;height:80px;border-radius:20px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-weight:700;font-size:24px}
.pav{width:40px;height:40px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-weight:700;font-size:13px}
.dr-av.has-photo,.pav.has-photo,.avatar.has-photo{position:relative;overflow:hidden}
/* object-position sits ABOVE centre: these are headshots, and a centred square crop
   of a portrait cuts the top of the head off. 50% 20% keeps the face in frame. */
.dr-av img,.pav img,.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:inherit}
.bio-none{font-size:13.5px;color:var(--faint);font-style:italic}
.ph-sub{font-size:12px;margin-top:6px;color:var(--faint)}
/* ---- Data Tracker -------------------------------------------------------
   Green is Megan, blue is Mitch. Two colours for two QUESTIONS - "is this value
   right?" against "where is this value?" - not two priority levels. */
.trk-b{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:999px;font-size:10.5px;font-weight:700;line-height:16px;text-align:center;color:#fff}
.trk-g{background:#12a150}.trk-bl{background:#2a78d6}

     LeavenWealth mark. */

  liquid:{name:'Liquid Lending',short:'LL',color:'#eda100',soft:'#fdf2da',line:'#f6e2ac',logo:'/icons/liquid-mark.svg'},
};
/* portal brand id -> Supabase company_id (CLAUDE.md) */
const BRAND_COMPANY_ID={leadli:'c0000000-0000-4000-8000-000000000001',folio:'c0000000-0000-4000-8000-000000000002',leavenwealth:'c0000000-0000-4000-8000-000000000003',liquid:'c0000000-0000-4000-8000-000000000004'};
const brandCompanyId=b=>BRAND_COMPANY_ID[b]||null;

/* ===========================================================================
   PERMISSION GATE. Everything below reads the single dash_my_access() payload
   held in `dashAccess`, whose shape is
     { user, companies:{<id>:name}, access:{ "<company_id>|exec": {<nav_id>:level} } }
   An absent key means no access. Never call dash_level() per module.

   SCOPE FIRST, ALWAYS. nav ids are unique per scope but NOT across scopes:
   `team`, `financials` and `investors` all appear under `exec` AND under company
   scopes, with different meanings and independent grants. So a nav id alone can
   never answer "may I see this" - it has to be resolved inside a scope. That is
   why every function here takes, or derives, a scope before it looks at an id.

   brand 'all' is the ONLY thing that maps to the exec scope: BRAND_COMPANY_ID has
   four keys and no 'all', brandCompanyId('all') is null, and null is what the
   catalog stores for Executive Board.
   =========================================================================== */
function accessScope(b){ return b==='all' ? 'exec' : brandCompanyId(b); }

/* The {nav_id: level} map for a brand, or null when the brand is not held at all.
   Returns null rather than {} so "no access" and "access to nothing" stay
   distinguishable - the switcher needs that difference. */
function scopeAccess(b){
  if(!dashAccess||!dashAccess.access) return null;
  const k=accessScope(b);
  if(!k) return null;
  return dashAccess.access[k]||null;
}
/* 'write' | 'read' | null for one nav id inside one brand's scope. */
function navLevel(b,navId){ const m=scopeAccess(b); return (m&&m[navId])||null; }

/* Brands the signed-in user can actually reach, in the fixed BRANDS order.
   Exec is included only when there is an `exec` entry, which is what makes an
   admin without an Exec grant not see the group view. */
function allowedBrands(){
  return Object.keys(BRANDS).filter(function(b){
    const m=scopeAccess(b);
    return !!m && Object.keys(m).length>0;
  });
}

/* Can the signed-in user write in the CURRENT brand's scope?
   Deliberately takes a nav id and uses the current brand rather than accepting a
   company: for an admin holding Exec, dash_level(null, <anything>) resolves to
   write for any module string at all, so a null-company "am I allowed" check would
   silently answer yes to everything. Scope comes from `brand`, never from the
   caller. */
function canWrite(navId){ return navLevel(brand,navId)==='write'; }
function canRead(navId){ return navLevel(brand,navId)!==null; }

/* Users & Roles is ROLE-gated, not permission-gated: shown when dash_role() is
   owner or admin. An admin must not be able to lose the screen that fixes access,
   which is what requiring a module grant for it would allow.

   THIS IS THE ONE EXCEPTION to "add a nav item, add its catalog row", and it is
   forced rather than preferred. `access` exists in dashboard_module only under
   Executive Board; no company has an access row. Requiring the grant would make the
   per-brand item invisible to everyone INCLUDING the owner, because there would be
   nothing to resolve against.

   Do NOT seed per-brand access rows to make it symmetrical: a catalog row means
   grantable, and grantable means an owner could hand Users & Roles to a plain user,
   which is exactly what requirement 3 forbids. The exec row stays where it is -
   inert, nothing reads it, but it keeps the exec catalog matching MENUS 8-for-8 so a
   future nav diff comes back clean. */
function canSeeAccess(){
  const r=dashAccess&&dashAccess.user&&dashAccess.user.role;
  return r==='owner'||r==='admin';
}

   org and department charts, which encode reporting lines the database does not hold

let teamRows=null, teamErr=null, teamFetching=false;
/* Data Tracker. Megan = "this value is wrong or unclear"; Mitch = "this value is
   absent". Two lists, one screen, deliberately not merged. */
let trkData=null, trkErr=null, trkFetching=false, trkWho='megan';
function fetchTracker(force){
  if(trkFetching) return;
  if(trkData && !force) return;
  /* Do not retry after a failure unless asked: fetchTracker() calls render() on error,
     and anything that re-enters render() from here can spin. */
  if(trkErr && !force) return;
  trkFetching=true;
  fetch('/api/tracker',{headers:authHeadersPortal()})
    .then(r=>r.text().then(t=>{let b=null;try{b=t?JSON.parse(t):null;}catch(e){b={error:t};}
      if(!r.ok) throw new Error((b&&b.error)||('HTTP '+r.status)); return b;}))
    .then(d=>{trkData=d;trkErr=null;trkFetching=false;render();})
    .catch(e=>{trkErr=e.message;trkFetching=false;render();});
}
function authHeadersPortal(){ return {Accept:'application/json'}; }
function setTrkWho(w){ trkWho=w; render(); }
/* Status written straight through; the row is patched locally so the list does not
   jump while somebody is working down it. */
function trkSetStatus(id,kind,status){
  fetch('/api/tracker/'+encodeURIComponent(id),{method:'PATCH',
    headers:{'Content-Type':'application/json'},credentials:'include',
    body:JSON.stringify({status:status,kind:kind})})
   .then(r=>r.ok?r.json():r.json().then(b=>{throw new Error(b.error||'HTTP '+r.status);}))
   .then(()=>{ const list=(trkData&&trkData[trkWho])||[];
     const row=list.find(x=>String(x.id)===String(id)); if(row) row.status=status;
     fetchTracker(true); })
   .catch(e=>alert('Could not save: '+e.message));
}
function fetchTeam(){
  if(teamFetching) return; teamFetching=true;
  PortalSession.client().then(c=>c.auth.getSession()).then(r=>{
    const t=r&&r.data&&r.data.session&&r.data.session.access_token;
    if(!t) throw new Error('Your session has expired. Sign in again.');
    return fetch('/api/team',{headers:{Authorization:'Bearer '+t}});
  }).then(r=>r.text().then(txt=>{
    let b=null; try{b=txt?JSON.parse(txt):null;}catch(e){b={error:txt};}
    if(!r.ok) throw new Error((b&&b.error)||('HTTP '+r.status));
    return b;
  })).then(d=>{teamRows=d.people||[];teamErr=null;teamFetching=false;render();})
    .catch(e=>{teamErr=e.message;teamFetching=false;render();});
}
/* Nav badges: green = Megan's open exceptions, blue = Mitch's open backfill items.

   It must NEVER fetch. The nav is painted by render(); anything here that can call
   render() again closes a loop, and a loop here takes the whole page down including
   the auth gate - which presents as sign-in bouncing rather than as a broken nav.
   The Data Tracker screen loads its own data when opened; the badges wait for it.

   This function is called from the nav template, so deleting it is not a no-op: it is
   a ReferenceError on every render. That is exactly what happened when the tracker
   block was rebuilt around it. */
function trkNavBadges(){
  if(!trkData) return '';
  const c=trkData.counts||{};
  return `<span class="trk-b trk-g" title="Megan — open exceptions">${c.megan||0}</span>`
       + `<span class="trk-b trk-bl" title="Mitch — open backfill items">${c.mitch||0}</span>`;
}

const TRK_MITCH_STATUS=['open','in_progress','blocked','waiting_on_doc','done'];

const trkDate=d=>d?String(d).slice(0,10):'';

function trkPersonCard(id,name,question,open,total,tone){

  return `<select class="trk-sel" onchange="trkSetStatus('${esc(r.id)}','${esc(r.kind||'')}',this.value)">`

function trkMegan(rows){
  const body=rows.map(r=>`<tr>
    <td><div class="trk-t">${esc(r.record||'')}</div><div class="trk-s">${esc(r.field_name||'')} &middot; ${esc(trkWords(r.issue_type))}</div></td>

/* MITCH - the value is absent. Blocked first: a blocker has to clear before the work
   can start at all, so it is the only ordering that matches how the list gets used. */
function trkMitch(rows){
  const rank={blocked:0,waiting_on_doc:1,open:2,in_progress:3,done:4};
  const sorted=rows.slice().sort((a,b)=>(rank[a.status]??9)-(rank[b.status]??9));
  const body=sorted.map(r=>`<tr>
    <td><div class="trk-t">${esc(r.title||r.record||'')}</div><div class="trk-s">${esc(r.record||'')}</div></td>
    <td>${esc(r.area||'')}<div class="trk-s">${esc(r.kind||'')}</div></td>
    <td>${r.blocked_reason?`<span class="trk-block">${esc(r.blocked_reason)}</span>`:(r.notes?esc(r.notes):'<span class="trk-s">\u2014</span>')}</td>
    <td>${esc(r.source_document||'')}<div class="trk-s">${r.due_date?'due '+esc(trkDate(r.due_date)):esc(trkDate(r.raised))}</div></td>
    <td>${trkPill(r.status)}</td>
    <td class="r">${trkStatusSel(r,TRK_MITCH_STATUS)}</td>
  </tr>`).join('');
  return card('check','Data that is missing',rows.length,
    tbl([{t:'What'},{t:'Area'},{t:'Blocker / notes'},{t:'Source'},{t:'Status'},{t:'Set',r:1}],body),true);
}

/* ---- Supabase browser client ----
   The url and anon key come from /api/portal-config, not from a literal in this
   file. The key is publishable and RLS is the boundary, so the browser holding it
   was never the problem - a key committed to the repo that cannot be rotated
   without a deploy was.

   portal-session.js owns the client so that the session, the storage adapter and
   the remember-device window are decided in exactly one place. getSb() is async
   now; its only caller (loadAds) already awaited a possibly-null client. */
function getSb(){
  if(window.__sb) return Promise.resolve(window.__sb);
  if(!window.PortalSession) return Promise.resolve(null);
  return PortalSession.client().then(function(c){ window.__sb=c; return c; })
                      .catch(function(){ return null; });
}

function refreshCurrent(){
  if(isEmbedView()){const info=embedInfo();const f=info&&document.querySelector('#embedHost iframe[data-key="'+info.key+'"]');if(f){try{f.contentWindow.location.reload();}catch(e){f.src=f.src;}}return;}

/* ---- Loans (live from Supabase via /api/loans) ---- */
let loansCache=null;   // cached loans; only refetched when force=true (Refresh button)
async function loadLoans(force){
  const el=document.getElementById('loansBody'); if(!el) return;
  if(loansCache && !force){ el.innerHTML=renderLoans(loansCache); return; }
  try{
    const r=await fetch('/api/loans',{headers:{'Accept':'application/json'}});
    let data=null; try{ data=await r.json(); }catch(_){}
    if(!r.ok) throw new Error((data&&data.error)?data.error:('HTTP '+r.status));
    if(data && data.error) throw new Error(data.error);
    loansCache=(data&&data.loans)||[];
    el.innerHTML=renderLoans(loansCache);
  }catch(e){
    el.innerHTML=`<div class="muted" style="color:var(--rose);padding:10px 2px">Couldn't load loans (${esc(e.message)}). Needs DATA_SOURCE=supabase + a valid SUPABASE_DB_URL on the server. <a href="/api/loans" target="_blank" style="color:var(--accent)">/api/loans</a></div>`;
  }
}
function loanPillClass(s){const x=String(s||'').toLowerCase();if(x==='active'||x==='current')return 'green';if(x==='pending')return 'amber';return 'gray';}
function renderLoans(loans){
  if(!loans.length) return `<div class="placeholder">${I.bank}<div>No loans found in Supabase.</div></div>`;
  const num=v=>(v==null||v==='')?null:Number(v);
  const total=loans.reduce((a,l)=>a+(num(l.currentDebt)||0),0);
  const rated=loans.filter(l=>num(l.interestRatePct)!=null);
  const avg=rated.length?(rated.reduce((a,l)=>a+num(l.interestRatePct),0)/rated.length).toFixed(2)+'%':'—';
  const mats=loans.map(l=>l.maturityDate).filter(Boolean).sort();
  const active=loans.filter(l=>String(l.status||'').toLowerCase()==='active').length;
  const kpis=`<div class="kpis">${kpi('bank','Total debt',moneyk(total),loans.length+' loans')}${kpi('gauge','Avg rate',avg,'')}${kpi('cal','Next maturity',mats.length?mats[0]:'—','')}${kpi('check','Active',active,'of '+loans.length)}</div>`;
  const rows=loans.slice().sort((a,b)=>(num(b.currentDebt)||0)-(num(a.currentDebt)||0)).map(l=>{
    const nm=l.name||l.lender||l.loanNumber||('Loan '+String(l.id).slice(0,8));
    const sub=[l.lender,l.positionLabel].filter(Boolean).map(esc).join(' &middot; ');
    const debt=num(l.currentDebt)!=null?money(num(l.currentDebt)):'—';
    const rate=num(l.interestRatePct)!=null?num(l.interestRatePct)+'%':'—';
    return `<tr><td>${esc(nm)}${sub?`<div style="font-size:11px;color:var(--faint)">${sub}</div>`:''}</td><td class="r">${debt}</td><td class="r">${rate}</td><td>${l.maturityDate||'—'}</td><td>${pill(l.status||'None',loanPillClass(l.status))}</td></tr>`;
  }).join('');
  return kpis+card('bank','Loan book',loans.length,tbl([{t:'Loan'},{t:'Current debt',r:1},{t:'Rate',r:1},{t:'Maturity'},{t:'Status'}],rows),true);
}

/* ---- Marketing / Ads (live meta_ads_insight via Supabase; baked fallback) ---- */
let adsCampaign='all', adsRows=null, adsMode='baked', adsFetched=false, adsBrandKey=null;
function setAdsCampaign(v){adsCampaign=v;const el=document.getElementById('adsBody');if(el)el.innerHTML=renderAdsBody();}
function adShortDay(d){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d||''));if(!m)return String(d||'');return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1]+' '+(+m[3]);}
function adsScopedRows(){
  if(adsMode==='live'&&adsRows){
    /* campaign_id is null on every live row - n8n writes the NAME and not the id - so
       keying on it collapsed every campaign into one bucket labelled "Campaign null".
       The name is what the feed actually provides, so it is the fallback key. */
    return {source:'live',rows:adsRows.map(r=>({date:String(r.date_start),spend:+r.spend||0,imp:+r.impressions||0,clicks:+r.clicks||0,leads:+r.leads||0,cid:String(r.campaign_id||r.campaign_name||'unknown'),cname:r.campaign_name||('Campaign '+(r.campaign_id||'unnamed'))}))};
  }
  const camps=ADS_CAMPAIGNS.filter(c=>brand==='all'||c.brand===brand);
  const rows=[];
  camps.forEach(c=>c.days.forEach(d=>rows.push({date:d.date,spend:d.spend,imp:d.imp,clicks:d.clicks,leads:d.leads,cid:c.id,cname:c.name})));
  return {source:'baked',rows};
}
async function loadAds(force){
  const el=document.getElementById('adsBody'); if(!el) return;
  if(adsFetched && adsBrandKey===brand && !force){ el.innerHTML=renderAdsBody(); return; }  // cached
  const sb=await getSb(); let session=null;   /* async now: config comes from /api/portal-config */
  if(sb){ try{ session=(await sb.auth.getSession()).data.session; }catch(e){} }
  if(!sb||!session){ adsRows=null; adsMode='baked'; adsFetched=true; adsBrandKey=brand; el.innerHTML=renderAdsBody(); return; }
  el.innerHTML=`<div class="muted" style="padding:12px 2px">Loading ad data&hellip;</div>`;
  try{
    const since=new Date(Date.now()-13*864e5).toISOString().slice(0,10);
    let q=sb.from('meta_ads_insight').select('date_start,spend,impressions,clicks,inline_link_clicks,leads,cost_per_lead,cpm,cpc,ctr,campaign_id,campaign_name').gte('date_start',since);
    /* MIRROR THE RLS RULE, do not narrow past it. meta_ads_insight rows carry a
       company_id only if whatever wrote them set one, and n8n does not - every live
       row is untagged. An .eq(company_id) filter therefore matched nothing, so the
       screen went empty the moment portal auth existed: before that there was no
       session, it fell back to baked demo data, and the gap was invisible.

       The SELECT policy already allows "company_id = mine OR (company_id is null and
       my tenant)", so asking for the same shape cannot return a row the database
       would have withheld. */
    const cid=brandCompanyId(brand);
    if(cid) q=q.or(`company_id.eq.${cid},company_id.is.null`);
    const {data,error}=await q;
    if(error) throw error;
    adsRows=data||[]; adsMode='live';
  }catch(e){ adsRows=null; adsMode='baked'; }
  adsFetched=true; adsBrandKey=brand;
  el.innerHTML=renderAdsBody();
}
function renderAdsBody(){
  const {source,rows}=adsScopedRows();
  /* "No data yet" reads as a broken screen. When the query DID run, the honest
     statement is that the feed has written nothing into the window - that is a data
     problem to chase in n8n, not something to look for in here. */
  if(!rows.length) return `<div class="placeholder">${I.trend}<div>${source==='live'
    ? 'No ad data in the last 14 days.<div class="ph-sub">The query ran and returned nothing &mdash; Meta ads land in <b>meta_ads_insight</b> via n8n, so nothing has been written for this window.</div>'
    : 'No ad data for '+(brand==='all'?'this date range':esc(BRANDS[brand].name))+' yet'}</div></div>`;
  const campMap=new Map(); rows.forEach(r=>{if(!campMap.has(r.cid))campMap.set(r.cid,r.cname);});
  if(adsCampaign!=='all'&&!campMap.has(adsCampaign)) adsCampaign='all';
  const scoped=adsCampaign==='all'?rows:rows.filter(r=>r.cid===adsCampaign);
  const spend=scoped.reduce((a,r)=>a+r.spend,0), leads=scoped.reduce((a,r)=>a+r.leads,0);
  const imp=scoped.reduce((a,r)=>a+r.imp,0), clicks=scoped.reduce((a,r)=>a+r.clicks,0);
  const cpl=leads?spend/leads:0, ctr=imp?(clicks/imp)*100:0;
  const kpis=`<div class="kpis">${kpi('dollar','Spend (14d)',money(spend),source==='live'?'live':'sample')}${kpi('target','Leads (14d)',leads,'','up')}${kpi('trend','Avg CPL',leads?money(cpl):'—','','down')}${kpi('gauge','Avg CTR',imp?ctr.toFixed(2)+'%':'—','')}</div>`;
  const opts=['<option value="all">All campaigns</option>'].concat([...campMap.entries()].map(([id,nm])=>`<option value="${esc(id)}"${adsCampaign===id?' selected':''}>${esc(nm)}</option>`)).join('');

/* MENUS filtered by the access payload for the CURRENT brand's scope.
   Section labels (items with .lbl and no .id) are dropped when nothing survives
   beneath them - a heading with an empty body reads as a bug, not as a permission. */
/* `access` is the ONE id exempt from the permission check - see canSeeAccess for
   why it has to be, and why the missing per-brand catalog rows must not be added. */
/* `access` and `tracker` are ROLE-gated, not permission-gated: neither has a row in
   dashboard_module, so navLevel() returns null and the generic test would hide them
   from everyone including the owner. Both sit under Admin and both are screens that
   fix data rather than read it, so owner/admin is the right gate.

   This is the ONLY place that exception lives. Adding a catalog row instead would make
   them grantable, and "grantable" for the screen that fixes everyone's access is a
   different decision - see the Users & Roles notes in CLAUDE.md. */
function itemVisible(b,id){ return (id==='access'||id==='tracker') ? canSeeAccess() : !!navLevel(b,id); }
function visibleMenu(b){
  const items=MENUS[b]||[];
  const out=[];
  for(let i=0;i<items.length;i++){
    const it=items[i];
    if(it.lbl){
      /* Look ahead to the next label: keep this one only if something between
         here and there is visible. */
      let any=false;
      for(let j=i+1;j<items.length&&!items[j].lbl;j++){
        if(itemVisible(b,items[j].id)){ any=true; break; }
      }
      if(any) out.push(it);
      continue;
    }
    if(itemVisible(b,it.id)) out.push(it);
  }
  return out;
}
function buildNav(){
  document.getElementById('nav').innerHTML=visibleMenu(brand).map(it=>it.lbl
    ?`<div class="nav-lbl">${it.lbl}</div>`
    :`<div class="nav-item ${it.id===view?'active':''}" onclick="setView('${it.id}')">${I[it.ic]}<span>${it.label}</span>${it.id==='tracker'?trkNavBadges():(it.badge?`<span class="badge">${it.badge}</span>`:'')}</div>`
  ).join('');
}

function currentItem(){return (MENUS[brand]||[]).find(x=>x.id===view)||null;}

function tasksSub(){return (brand!=='leavenwealth'&&tasksTab==='ptasks')?'overview':tasksTab;}
/* Every Tasks screen reads ClickUp — Property Tasks and Tasks > Overview are
   /ops embeds rather than native, but the data behind them is the same ClickUp

function needsClickUp(){return view==='tasks'||view==='alltasks';}
function clickUpGated(){return needsClickUp()&&!!window.PortalAuth&&!PortalAuth.isSignedIn();}

function showEmbed(info){

function hideAllEmbeds(){const host=document.getElementById('embedHost');if(host)Array.prototype.forEach.call(host.children,function(c){c.style.display='none';});}
/* ---- URL state ---------------------------------------------------------
   The screen you are on lives in the hash, so a reload lands where you left off
   instead of bouncing back to Overview, and a screen can be linked to. Written
   with replaceState: navigating the portal is not browser history, and pushState
   here would make Back walk backwards through every tab you touched.

   portal-auth.js parses this same hash for its #auth=<token> hand-back and
   preserves the params it does not own, so the two coexist. It also runs first
   (script order in <head>), which means the token is already stripped by the
   time readState() looks. */
const SUBOF={tasks:()=>tasksTab,alltasks:()=>opsTab,loans:()=>loansTab,orgdept:()=>orgTab,departments:()=>orgTab};
const SUBOK={tasks:['overview','all','ptasks'],alltasks:OPS_TABS.map(t=>t[0]),loans:['book','views'],orgdept:['org','dept'],departments:['org','dept']};
function writeState(){
  /* The fragment IS the incoming deep link until the access payload arrives. The
     boot sequence renders once behind the gate before dashAccess exists, and that
     render would otherwise rewrite the fragment to whatever the pre-permission
     defaults were - so a shared link to Loans became a link to Overview before
     anyone could act on it. Nothing is user-visible while the gate is up, so there
     is nothing to lose by not writing yet. */
  if(!dashAccess) return;
  try{
    const p=new URLSearchParams();
    p.set('brand',brand);p.set('view',view);
    const sub=SUBOF[view]&&SUBOF[view]();
    if(sub)p.set('sub',sub);
    /* ?v= is the one-shot hand-back from the ClickUp round trip (see
       defaultReturnPath in portal-auth.js). It has been consumed by now, so drop
       it - leaving it would pin the URL to a screen you have since navigated off. */
    const q=new URLSearchParams(location.search);q.delete('v');
    const qs=q.toString();
    history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+'#'+p.toString());
  }catch(e){/* a hash we cannot write is not worth breaking a render over */}
}
/* Anything unrecognised falls back to the default rather than throwing: the hash
   is user-editable, and a stale link (a renamed view, a brand you lost access to)
   must not leave the portal on a blank screen. */
function readState(){
  let p;
  try{
    /* Straight from the fragment on a reload; from ?v= when we have just come
       back through ClickUp OAuth, which consumed the fragment for its token. */
    const v=new URLSearchParams(location.search).get('v');
    p=new URLSearchParams(v||(location.hash||'').replace(/^#/,''));
  }catch(e){return;}
  /* PERMISSION, not just existence. Filtering buildNav() gates the MENU; it does
     not gate the ROUTE. Before this, #brand=leadli&view=leads reached Leadli
     whether or not the user held it, and #brand=leavenwealth&view=loans reached
     Loans for someone granted only Properties - the item was missing from the
     sidebar while the screen rendered anyway.

     A denied request falls back to something they do hold rather than being
     honoured. RLS is still the real boundary; this is so the UI never shows a
     screen the person was not granted. */
  const b=p.get('brand');
  if(b&&BRANDS[b]&&MENUS[b]&&scopeAccess(b))brand=b;
  const v=p.get('view');
  if(v&&(MENUS[brand]||[]).some(x=>x.id===v)&&itemVisible(brand,v))view=v;
  else{const first=firstAllowedView(brand);view=first||'overview';}
  const s=p.get('sub');
  if(s&&SUBOK[view]&&SUBOK[view].indexOf(s)!==-1){
    if(view==='tasks')tasksTab=s;
    else if(view==='alltasks')opsTab=s;
    else if(view==='loans')loansTab=s;
    else orgTab=s;
  }
}
function render(){
  writeState();
  /* Route change closes the account menu: leaving it open over a screen the user has
     navigated away from is disorienting, and it contains a destructive action. */
  closeIdMenu(false);
  applyAccent();buildBrandMenu();buildNav();
  const b=BRANDS[brand];
  /* outerHTML, so the mark can switch between an <img> and an initials chip as
     the brand changes - setting textContent alone would leave a stale <img>. */
  document.getElementById('bpGlyph').outerHTML=brandMark(brand,'bp-glyph','bpGlyph');
  document.getElementById('bpName').textContent=b.name;
  document.querySelector('.bp-sub').textContent = switcherSub();
  document.getElementById('cbBrand').textContent=b.name;
  document.getElementById('cbView').textContent=' / '+currentLabel();
  const content=document.getElementById('content');
  const host=document.getElementById('embedHost');
  const embed=isEmbedView();
  const info=embed?embedInfo():null;
  content.className='content'+(embed?' wide embed-lean':'');
  /* Read-only means read-only: no New button where the level is 'read'. The
     database refuses the write anyway, but a button that always fails is worse
     than no button. canWrite() resolves inside the current brand's scope.

     Users & Roles names its action instead: "New" on an access screen is ambiguous -
     new what - and this is the only thing it creates. It is the single control for
     it; portal-users.js deliberately does not render its own, or there would be two
     buttons doing the same job. Shown on the same role gate as the screen itself. */
  const newBtn = view==='access'
    ? (canSeeAccess()?`<button class="btn" onclick="PortalUsers.openAdd()">${I.plus} Invite user</button>`:'')
    : (canWrite(view)?`<button class="btn">${I.plus} New</button>`:'');
  const pageH=embed?'':`<div class="page-h"><div><div class="page-t">${currentLabel()}</div><div class="page-s">${b.name}</div></div>${newBtn}</div>`;
  content.innerHTML=pageH+(V[view]?V[view]():`<div class="placeholder">${I.grid}<div>${currentLabel()}</div></div>`);
  /* The native Tasks screen must be painted after innerHTML replaces the
     container, not from inside the template string. brandSpaces and BRANDS are
     script-scoped consts, so portal-tasks.js cannot read them - pass them in. */
  if(view==='tasks' && tasksSub()==='all' && window.PortalTasks){
    /* readOnly hides the Tasks screen's write affordances - the status, assignee,
       due and priority popovers - for someone holding Tasks at 'read'. */
    PortalTasks.render(brand,'tasksNative',{spaces:brandSpaces(brand),brandName:BRANDS[brand].name,
                                            readOnly:!canWrite('tasks')});
  }
  /* Users & Roles, same arrangement. `scope` is what makes one component serve both
     views: 'exec' lists everyone with the businesses they reach, a company id lists
     only people who can reach that business. */
  if(view==='access' && window.PortalUsers && canSeeAccess()){
    PortalUsers.render(brand,'usersNative',{
      scope:accessScope(brand),
      me:dashAccess&&dashAccess.user,
      access:dashAccess&&dashAccess.access,
      companies:(dashAccess&&dashAccess.companies)||{},
    });
  }
  if(embed && info){ showEmbed(info); host.hidden=false; }
  else { host.hidden=true; hideAllEmbeds(); }
}
/* Both setters refuse anything the access payload does not carry, so a stale
   onclick, a console call or a race cannot land somewhere ungranted. */
function setBrand(id){
  if(!BRANDS[id]||!MENUS[id]||!scopeAccess(id)) return;
  brand=id;

}
function setView(id){
  if(!itemVisible(brand,id)) return;   /* itemVisible, not navLevel: `access` is role-gated */

document.documentElement.setAttribute('data-theme',theme);
document.getElementById('themeBtn').innerHTML=theme==='dark'?I.sun:I.moon;
/* ClickUp sign-in state. init() reads localStorage synchronously so the first
   paint is right, then verifies against /auth/me in the background.
   portal-tasks.js subscribes to PortalAuth.onChange itself, so a correction
   re-renders the Tasks view without portal.html doing anything. */
if(window.PortalAuth){

     embedded Tasks screens too - portal-tasks.js only owns #tasksNative. */
  PortalAuth.onChange(function(){render();});

/* Live sync. The server sends table names only; portal-realtime.js decides which
   views are stale. Only the visible view refetches - the rest are marked dirty
   and refetch when next opened. */
if(window.PortalRealtime) PortalRealtime.start({
  currentView: function(){ return view; },
  rerender:    function(){ render(); },
  indicator:   'rtStamp',
  invalidate:  function(v){

    if(v==='*' || v==='ads'){ adsFetched=false; adsRows=null; adsBrandKey=null; }
    if((v==='*' || v==='tasks') && window.PortalTasks){ PortalTasks.invalidate(); }
    /* Users & Roles caches its list, so rerender() alone would repaint the SAME rows
       it already had. Dropping the cache is what makes the refresh a refetch. */
    if((v==='*' || v==='access') && window.PortalUsers){ PortalUsers.invalidate(); }
    /* Team directory caches its list the same way, so the staff binding in
       TABLE_VIEWS only refreshes it if the cache is dropped first. */
    if(v==='*' || v==='team'){ teamRows=null; teamErr=null; }
  },
});

/* Workspace-switcher counts: fetch once on boot, re-render when they land. */
fetch('/api/org/summary').then(r => r.ok ? r.json() : null).then(d => {
  if (d && !d.error) { orgSummary = d; render(); }
}).catch(() => {});
readState();   /* before the first render, so a reload paints the right screen once */
/* Someone pasting a portal link into the tab they already have open changes only
   the fragment, which is not a navigation - without this the URL would say one
   screen and the app would show another. writeState() uses replaceState, which
   never fires hashchange, so this cannot loop. */
window.addEventListener('hashchange',function(){readState();render();});
render();

/* ===========================================================================
   AUTH GATE, part 2 of 2. The style tag in <head> hides the body; this decides
   whether to reveal it or leave for /login.

   The shell above has already rendered behind the curtain. That is deliberate:
   building first and revealing second means no layout jump, and a signed-out
   visitor still never sees a frame of it because visibility:hidden applies from
   before the first paint.

   `access` is dash_my_access(), fetched ONCE and held. Step 3 gates the switcher
   and the nav off it.
   =========================================================================== */
/* ===========================================================================
   Identity: the sidebar chip, its menu, and the read-only profile panel.

   Everything here reads the dash_my_access() payload already held in dashAccess -
   no extra round trip. The module LABELS come from GET /api/access/modules, so the
   panel reads "Properties: Read & Write" rather than "properties: write"; the
   labels are fetched once, only when the panel is first opened.
   =========================================================================== */
const ROLE_WORD={owner:'Owner',admin:'Administrator',user:'User'};
let moduleLabels=null;      /* "<scope>::<nav_id>" -> label */

function idInitials(u){
  const n=(u&&u.full_name||'').trim();
  if(n){const p=n.split(/\s+/);return ((p[0]||'')[0]||'')+(p.length>1?(p[p.length-1][0]||''):'');}
  return ((u&&u.email||'?')[0]||'?').toUpperCase();
}

function renderIdentity(){
  const u=dashAccess&&dashAccess.user; if(!u) return;
  /* The signed-in person's headshot, layered over their initials exactly like every
     other avatar here - so a photo that fails to load leaves the chip rather than an
     empty circle. dash_my_access() already returns avatar_url; only this was ignoring
     it, which is why the chip stayed initials while the lists showed photos. */
  const av=document.getElementById('idAvatar');
  av.innerHTML=esc(idInitials(u).toUpperCase())+
    (u.avatar_url?`<img src="${esc(u.avatar_url)}" alt="" onerror="staffPhotoFailed(this)">`:'');
  av.classList.toggle('has-photo',!!u.avatar_url);
  document.getElementById('idName').textContent=u.full_name||u.email;
  document.getElementById('idRole').textContent=ROLE_WORD[u.role]||u.role||'';
}

function closeIdMenu(returnFocus){
  const m=document.getElementById('idMenu'); if(!m||m.hidden) return;
  m.hidden=true;
  document.getElementById('idChip').setAttribute('aria-expanded','false');
  /* Focus goes back to the control that opened it, or keyboard users are dropped
     at the top of the document. */
  if(returnFocus) document.getElementById('idChip').focus();
}

function toggleIdMenu(ev){
  if(ev) ev.stopPropagation();
  const m=document.getElementById('idMenu');
  if(!m.hidden) return closeIdMenu(true);
  const u=(dashAccess&&dashAccess.user)||{};
  m.innerHTML=
    `<div class="idmenu-h">
       <div class="idmenu-n">${esc(u.full_name||'')}</div>
       <div class="idmenu-e">${esc(u.email||'')}</div>
       <div class="idmenu-r">Role: ${esc(ROLE_WORD[u.role]||u.role||'')}</div>
     </div>
     <button class="idmenu-i" role="menuitem" onclick="openProfile()">${I.user||I.users}<span>Profile settings</span></button>
     <button class="idmenu-i danger" role="menuitem" onclick="portalSignOut()">${I.logout||I.lock}<span>Log out</span></button>`;
  m.hidden=false;
  document.getElementById('idChip').setAttribute('aria-expanded','true');
  const first=m.querySelector('.idmenu-i'); if(first) first.focus();
}

/* Outside click and Escape. Bound once, at parse time, rather than per open. */
document.addEventListener('click',function(ev){
  const m=document.getElementById('idMenu');
  if(!m||m.hidden) return;
  if(ev.target.closest&&(ev.target.closest('#idMenu')||ev.target.closest('#idChip'))) return;
  closeIdMenu(false);
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Escape') return;
  const m=document.getElementById('idMenu');
  if(m&&!m.hidden) closeIdMenu(true);
});

/* PROFILE PANEL - read-only by decision. Name, email and role are changed on Users
   & Roles by an administrator, not here, so this states that rather than offering
   inputs that do nothing. */
function openProfile(){
  closeIdMenu(false);
  if(!moduleLabels){
    moduleLabels={};   /* set before the fetch so a second click cannot double-fire */
    PortalSession.client().then(c=>c.auth.getSession()).then(r=>{
      const t=r&&r.data&&r.data.session&&r.data.session.access_token;
      return fetch('/api/access/modules',{headers:{Authorization:'Bearer '+t}});
    }).then(r=>r.ok?r.json():{modules:[]}).then(d=>{
      (d.modules||[]).forEach(m=>{moduleLabels[(m.company_id||'exec')+'::'+m.nav_id]=m.label;});
      /* Repaint only if it is still open - the labels can land after a close. */
      if(document.getElementById('profileDrawer').classList.contains('open')) paintProfile();
    }).catch(()=>{});
  }
  /* .open, not the hidden attribute: .scrim and .drawer animate on that class, and
     display:none would kill the transition. */
  document.getElementById('profileScrim').classList.add('open');
  document.getElementById('profileDrawer').classList.add('open');
  paintProfile();
}
function closeProfile(){
  document.getElementById('profileScrim').classList.remove('open');
  document.getElementById('profileDrawer').classList.remove('open');
  document.getElementById('idChip').focus();
}
function levelWord(l){ return l==='write'?'Read & Write':'Read'; }

function paintProfile(){
  const u=(dashAccess&&dashAccess.user)||{};
  const acc=(dashAccess&&dashAccess.access)||{};
  const companies=(dashAccess&&dashAccess.companies)||{};
  let accessHtml;
  if(u.role==='owner'){
    /* 49 rows that always say the same thing tell nobody anything. */
    accessHtml='<div class="pf-full">Full access to all workspaces.</div>';
  }else{
    const scopes=Object.keys(acc);
    accessHtml=scopes.length?scopes.map(s=>{
      const name=s==='exec'?'Executive Board':(companies[s]||'A business');
      const mods=acc[s]||{};
      const rows=Object.keys(mods).map(nav=>{
        const label=(moduleLabels&&moduleLabels[s+'::'+nav])||nav;
        return `<li>${esc(label)}: ${esc(levelWord(mods[nav]))}</li>`;
      }).join('');
      return `<div class="pf-scope"><div class="pf-scope-n">${esc(name)}</div><ul>${rows}</ul></div>`;
    }).join(''):'<div class="pf-full">No access has been granted yet.</div>';
  }
  document.getElementById('profileDrawer').innerHTML=
    `<div class="pf-head">
       <div><div class="pf-t">Profile settings</div><div class="pf-s">Your account and what it can reach</div></div>
       <button class="pf-x" onclick="closeProfile()" aria-label="Close">&#10005;</button>
     </div>
     <div class="pf-body">
       <div class="pf-row"><span class="pf-k">Name</span><span class="pf-v">${esc(u.full_name||'—')}</span></div>
       <div class="pf-row"><span class="pf-k">Email</span><span class="pf-v">${esc(u.email||'—')}</span></div>
       <div class="pf-row"><span class="pf-k">Role</span><span class="pf-v">${esc(ROLE_WORD[u.role]||u.role||'—')}</span></div>
       <div class="pf-note">These are managed for you. To change your name, email or
         role, contact an administrator &mdash; they can update them on Users &amp; Roles.</div>
       <div class="pf-sec">Your access</div>
       ${accessHtml}
     </div>`;
}

function reveal(){ const g=document.getElementById('authGate'); if(g) g.remove(); }
function toLogin(){ location.replace('/login'); }

/* A plain page rather than the shell. Someone with a valid Supabase session but no
   staff row, or dashboard_access = false, has authenticated but has been granted
   nothing - rendering the empty shell would look broken. Step 3 replaces this with
   the full "no access" treatment and the filtered switcher. */
function showNoAccess(msg){
  document.querySelector('.app').innerHTML =
    `<div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;padding:32px">
       <div style="max-width:420px;text-align:center">
         <div style="font-size:15px;font-weight:650;margin-bottom:8px">No access yet</div>
         <div style="font-size:13px;color:var(--text2);line-height:1.6">${esc(msg)}</div>
         <button class="btn" style="margin-top:18px" onclick="portalSignOut()">Sign out</button>
       </div>
     </div>`;
  reveal();
}

/* One teardown, used by the menu, by an expired remember-window and by a
   SIGNED_OUT event, so the three cannot drift. PortalSession.signOut() clears the
   remember stamp first, then Supabase, then the ClickUp token. */
function portalSignOut(){
  if(!window.PortalSession) return toLogin();
  PortalSession.signOut().then(toLogin, toLogin);
}

if(window.PortalSession){
  /* enforceRememberWindow FIRST: past the 30-day stamp the session is torn down
     before we even look at it, because Supabase would otherwise refresh forever. */
  PortalSession.enforceRememberWindow()
    .then(function(expired){ if(expired) { toLogin(); return null; } return PortalSession.getSession(); })
    .then(function(session){
      if(!session){ toLogin(); return null; }
      return PortalSession.access().catch(function(err){
        showNoAccess('Your access could not be loaded: '+(err&&err.message||err)+
                     ' If this persists, contact an administrator.');
        return undefined;
      });
    })
    .then(function(a){
      if(a===undefined||a===null) return;          /* already redirected or handled */
      dashAccess=a;
      if(!a.user){
        showNoAccess('Your account can sign in, but no dashboard access has been granted to it yet. '+
                     'Contact an administrator to be given access.');
        return;
      }
      /* A staff row with dashboard_access but no grants at all: authenticated,
         recognised, and holding nothing. Distinct from the case above, and it
         reaches the same page rather than an empty shell. */
      if(allowedBrands().length===0){
        showNoAccess('No workspace access has been granted to your account yet. '+
                     'Contact an administrator to be given access to a business.');
        return;
      }
      /* Pick the landing screen from what they hold. Exec first, because the group
         view is the intended default, then the first workspace they do hold - a
         user without an Exec grant used to land on an empty Executive Board because
         `brand` and `view` were initialised to 'all'/'exec' unconditionally. */
      if(!scopeAccess(brand)) brand=allowedBrands()[0];
      if(!navLevel(brand,view)) view=firstAllowedView(brand)||'overview';
      /* Re-apply the fragment now that the payload exists, so a deep link is
         honoured when it is allowed and dropped when it is not. readState() ran
         before the payload landed, when every permission check was a no-op. */
      readState();
      renderIdentity();     /* the sidebar chip, from the same payload */
      render();
      reveal();
    })
    .catch(function(){ toLogin(); });

  /* Involuntary sign-out - a revoked session, a refresh that fails - runs the same
     teardown as the menu rather than leaving a dead shell on screen. */
  PortalSession.client().then(function(c){
    c.auth.onAuthStateChange(function(event){
      if(event==='SIGNED_OUT') portalSignOut();
    });
  }).catch(function(){});
}else{
  /* portal-session.js failed to load. Fail closed: this is the gate. */
  toLogin();
}
restoreSidebar();
</script>
</body></html>
