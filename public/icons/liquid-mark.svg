  <g fill="none" stroke="#101f57" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 60 64 16l52 44"/>
    <path d="M26 58v34M102 58v34"/>
  </g>
  <g fill="#101f57">
    <rect x="50" y="42" width="12" height="12" rx="1.5"/>
    <rect x="66" y="42" width="12" height="12" rx="1.5"/>
    <rect x="50" y="58" width="12" height="12" rx="1.5"/>
    <rect x="66" y="58" width="12" height="12" rx="1.5"/>
  </g>
  <ellipse cx="64" cy="102" rx="52" ry="19" fill="none" stroke="#101f57" stroke-width="7"/>
  <ellipse cx="64" cy="102" rx="32" ry="11" fill="none" stroke="#12b0d6" stroke-width="7"/>
